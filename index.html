:root{
  --bg:#fff8f9; --panel:#ffffff; --line:#f3d3db; --line2:#f9e4e9;
  --fg:#1d0b12; --muted:#7d5461;
  --red:#e3173e; --red2:#ff6b8a; --pink:#ffd6df; --pink2:#fff0f3; --gold:#c9a24a;
  --ok:#17a36d; --bad:#1d0b12; --pass:#f59e0b;
  --display:'Unbounded','Arial Black','Segoe UI',system-ui,sans-serif; --body:'Manrope','Segoe UI',system-ui,sans-serif; --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;font-weight:600}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--pink2);color:var(--fg);transition:transform .08s,filter .15s,background .15s}
button:hover{filter:brightness(.97)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red2);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed;filter:none}
button.primary{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(227,23,62,.22)}
button.primary:hover{filter:brightness(1.08)}
button.ok{background:var(--ok);color:#fff}
button.bad{background:var(--bad);color:#fff}
button.pass{background:var(--pass);color:#fff}
button.ghost{background:transparent;border:1.5px solid var(--line)}
button.link{background:transparent;color:var(--red);padding:4px 6px}
button.danger{background:#fde0e4;color:#9b1030}
button.small{padding:6px 10px;font-size:13px;border-radius:9px}
button.xl{padding:18px 12px;font-size:17px;border-radius:14px}
button kbd{margin-left:6px}
input,select,textarea{font:inherit;background:#fff;color:var(--fg);border:1.5px solid var(--line);border-radius:9px;padding:8px 10px}
input[type=number]{width:72px}
textarea{width:100%;min-height:200px;font-family:ui-monospace,monospace;font-size:12px}
kbd{font-family:ui-monospace,monospace;font-size:11px;font-weight:600;background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--pink2);color:var(--red)}
.tag.ok{background:#e4f6ee;color:var(--ok)}
.tag.dark{background:var(--fg);color:#fff}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h3{font-size:15px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(29,11,18,.05),0 8px 24px rgba(227,23,62,.05)}
.hidden{display:none!important}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}

/* ===== PANEL ===== */
#app{height:100%;display:flex;flex-direction:column}
.panel{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:#fff;border-bottom:1px solid var(--line2)}
.topbar .title{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:8px}
.topbar .title img{height:30px;width:auto}
.topbar .spacer{flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-right:6px}
.dot.on{background:var(--ok)}
.main{display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));min-height:0;overflow:auto}
@media (max-width:1100px){.main{grid-template-columns:1fr}.left{order:2}.controls{order:1}.preview{max-width:min(100%,380px)}.topbar .title span{display:none}}
.preview{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;max-width:min(100%,calc((100vh - 300px) * 16 / 9));background:#fff;box-shadow:0 2px 6px rgba(29,11,18,.08),0 14px 36px rgba(227,23,62,.10)}
.previewLabel{position:absolute;top:8px;left:10px;z-index:5;font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:rgba(29,11,18,.7);color:#fff;padding:3px 8px;border-radius:6px;font-weight:800}
.controls{display:flex;flex-direction:column;gap:12px;min-width:0}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status .game{font-family:var(--display);font-weight:700;font-size:16px;color:var(--red)}
.status .pos{color:var(--muted);font-size:14px;font-weight:700}
.turnChip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--tc,#999);color:var(--tk,#fff);font-weight:800;font-size:13px}
.turnChip i{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.scoreRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.teamChip{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:8px 10px;border-radius:12px;background:#fff;border:2px solid transparent;box-shadow:inset 6px 0 0 var(--tc,#999)}
.teamChip.turn{border-color:var(--tc,#999)}
.teamChip .n{font-weight:800;font-size:14px;flex:1 1 100%;min-width:0;line-height:1.15;padding-left:6px}
.teamChip .adj:first-of-type{margin-left:auto}
.teamChip .s{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--tc,#333);cursor:pointer;padding:0 4px;border-radius:6px}
.teamChip .s:hover{background:var(--pink2)}
.teamChip .adj button{padding:3px 8px;font-size:12px;border-radius:6px}
.private{background:#fff;border:2px dashed var(--red);border-radius:14px;padding:10px 12px;position:relative}
.private .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:800;display:flex;justify-content:space-between;gap:8px}
.private .lbl span:last-child{font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.private .ans{font-size:22px;font-weight:800;margin-top:4px;line-height:1.2}
.private.peek .ans,.private.peek .list{filter:blur(7px)}
.private.peek:hover .ans,.private.peek:hover .list{filter:none}
.lettersCtl{display:flex;flex-wrap:wrap;gap:6px}
.lettersCtl button{width:44px;height:44px;font-family:var(--display);font-size:17px;padding:0;position:relative;border:2px solid transparent;background:var(--pink2)}
.lettersCtl button.active{border-color:var(--red);box-shadow:0 0 0 3px rgba(227,23,62,.18)}
.lettersCtl button.ok{background:var(--ok);color:#fff}
.lettersCtl button.bad{background:var(--bad);color:#fff}
.lettersCtl button.pass{background:var(--pass);color:#fff}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big2 button{padding:20px 8px;font-size:18px;border-radius:14px}
.big2 button small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:2px}
.progress{display:flex;gap:4px;flex-wrap:wrap}
.progress span{width:14px;height:14px;border-radius:4px;background:var(--pink);display:inline-block;position:relative}
.progress span.ok{background:var(--ok)}
.progress span.none{background:var(--fg)}
.progress span.skip{background:var(--pass)}
.progress span.cur{outline:2px solid var(--red);outline-offset:1px}
.next{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;color:var(--fg);background:var(--pink2);border-radius:10px;padding:8px 10px}
.next .sec{color:var(--red)}
.hint{font-size:12px;color:var(--muted);background:var(--pink2);border-radius:8px;padding:6px 10px}
.hint.warn{background:#fde0e4;color:#9b1030;font-weight:700}
.big3 button{padding:18px 8px;font-size:16px;border-radius:14px}
.big3 button small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:2px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:8px;border-radius:999px;background:var(--pink)}
.steps span.on{background:var(--red)}
.timerBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timerBar .t{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;min-width:60px}
.timerBar .t.low{color:var(--red)}
.timerBar .st{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--pink2);color:var(--muted)}
.timerBar .st.run{background:#e4f6ee;color:var(--ok)}
.timerBar .st.done{background:#fde0e4;color:var(--red)}
.last{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.hist{font-size:12px;color:var(--muted);max-height:120px;overflow:auto;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(29,11,18,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--bg);border-radius:18px;padding:18px;max-width:1200px;width:100%;max-height:92vh;overflow:auto}
.modal .box.narrow{max-width:720px}
.cfgGrid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2fr);gap:14px}
.cfgGrid .wide{grid-column:1/-1}
@media (max-width:860px){.cfgGrid{grid-template-columns:1fr}}
.cfgTable{width:100%;border-collapse:collapse;font-size:14px}
.cfgTable th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line2)}
.cfgTable td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.cfgTable tr.off td{opacity:.45}
.cfgTable td .muted{font-size:12px}
.optRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:stretch}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--pink2);cursor:pointer;border:2px solid transparent}
.opt.on{background:#fff;border-color:var(--line)}
.opt input{margin-top:3px}
.opt small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.edGrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.edGrid{grid-template-columns:1fr}}
.edNav{display:flex;flex-direction:column;gap:4px;position:sticky;top:0}
.edNav button{text-align:left;background:#fff;border:2px solid transparent;display:flex;justify-content:space-between;gap:8px;align-items:center}
.edNav button.on{border-color:var(--red);color:var(--red)}
.edNav button small{color:var(--muted);font-weight:700}
.edNav .foot{margin-top:10px;display:grid;gap:4px}
.edNav .foot button{font-size:12px;background:transparent;color:var(--muted);padding:6px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{background:#fff;border:1.5px solid var(--line2)}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.item{background:#fff;border-radius:14px;padding:12px;display:grid;gap:8px;box-shadow:0 1px 2px rgba(29,11,18,.05)}
.item .hd{display:flex;align-items:center;gap:8px}
.item .hd .no{font-family:var(--display);color:var(--red);font-size:13px;width:28px}
.item .hd .sp{flex:1}
.item input[type=text]{width:100%}
.item .lg{font-size:18px;font-weight:800}
.item .emo{font-size:26px;letter-spacing:.12em}
.item .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item .grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.item .grid4 label{display:flex;align-items:center;gap:6px;font-size:13px}
.item .grid4 label b{width:16px;color:var(--red)}
.item .grid4 input{flex:1;min-width:0;padding:5px 8px}
.item img{width:120px;height:120px;object-fit:cover;border-radius:10px;background:var(--pink2)}
.items{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.items.one{grid-template-columns:1fr}
.item.photo{grid-template-columns:130px 1fr;align-items:start}
.item.nophoto{box-shadow:inset 0 0 0 2px var(--line2)}
.item .ph{width:120px;height:120px;border-radius:10px;background:var(--pink2);color:var(--red2);display:grid;place-items:center}
.item.photo .hd{grid-column:1/-1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#fff;border-radius:12px}
.sect{background:#fff;border-radius:14px;padding:14px;display:grid;gap:10px}
.sect h4{margin:0;font-family:var(--display);font-size:14px}
.sect p{margin:0;color:var(--muted);font-size:13px}
.setupGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.teamEdit{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:12px;background:#fff;box-shadow:inset 6px 0 0 var(--tc,#999),0 1px 2px rgba(29,11,18,.05)}
.teamEdit .nm{display:flex;gap:6px;align-items:center;padding-left:6px}
.teamEdit input[type=text]{flex:1;min-width:0;font-weight:800}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-left:6px}
.swatches button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatches button.sel{box-shadow:0 0 0 2px var(--fg)}
.swatches label{width:26px;height:26px;border-radius:50%;overflow:hidden;position:relative;cursor:pointer;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);box-shadow:0 0 0 1px var(--line)}
.swatches label input{position:absolute;inset:-10px;opacity:0;width:60px;height:60px;cursor:pointer}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.gameRow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:#fff}
.gameRow.off{opacity:.5}
.gameRow .nm{font-weight:800}
.gameRow .d{font-size:12px;color:var(--muted);font-weight:600}
.gameList{display:flex;flex-direction:column;gap:6px}
.gameList .g{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#fff;border-radius:12px;border:2px solid transparent}
.gameList .g.done{opacity:.5}
.gameList .g.cur{border-color:var(--red)}
.hotkeys{font-size:12px;color:var(--muted);line-height:1.9}
.resolvedBar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.resolvedBar b{color:var(--ok)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:#fff;font-weight:700;padding:10px 16px;border-radius:999px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.imgList{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.imgList .it{background:#fff;border-radius:10px;padding:6px;font-size:12px;text-align:center}
.imgList img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#fff}
.filebtn{display:inline-block;cursor:pointer;border:1.5px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:800}

/* ===== STAGE (vista pública) ===== */
.stage{width:100%;height:100%;overflow:hidden;position:relative;background:#fff;color:#1d0b12;font-family:var(--body);font-weight:600;container-type:size;--tc:#e3173e;--tk:#fff;--u:min(1cqh,0.5625cqw)}
.stage *{box-sizing:border-box}
.stage .glow{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(60cqw calc(75*var(--u)) at 102% 108%,#ffd9e1 0%,rgba(255,217,225,0) 70%),
  radial-gradient(45cqw calc(55*var(--u)) at -6% -12%,#fff0f3 0%,rgba(255,240,243,0) 70%)}
.stage .glow::after{content:"";position:absolute;pointer-events:none;right:-14cqw;bottom:-calc(34*var(--u));width:64cqw;height:64cqw;border-radius:50%;border:calc(.45*var(--u)) solid rgba(227,23,62,.09)}
.stage .inner{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(2.6*var(--u)) 4cqw;gap:calc(1.2*var(--u))}
.stage .inner>*{min-width:0;min-height:0}
.stage.enter .inner>*{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}
.stage.enter .inner>*:nth-child(2){animation-delay:.08s}
.stage.enter .inner>*:nth-child(3){animation-delay:.16s}
@keyframes enter{from{opacity:0;transform:translateY(calc(2.5*var(--u)))}to{opacity:1;transform:none}}
/* header */
.stage .hdr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:2cqw;min-height:calc(13*var(--u))}
.stage .brand{display:flex;align-items:center;gap:1.4cqw;min-width:0}
.stage .brand img{height:calc(11*var(--u));width:auto;flex:none;filter:drop-shadow(0 calc(.6*var(--u)) calc(1.2*var(--u)) rgba(227,23,62,.18))}
.stage .brand .wm{font-family:var(--serif);font-style:italic;font-size:calc(2.9*var(--u));color:#7d5461;line-height:1}
.stage .brand .gn{font-family:var(--display);font-weight:900;font-size:calc(3.4*var(--u));letter-spacing:.01em;text-transform:uppercase;color:#e3173e;line-height:1.05;text-wrap:balance}
.stage .turn{display:flex;align-items:center;gap:1.2cqw;font-weight:800;font-size:calc(3.6*var(--u));padding:calc(1.1*var(--u)) 2.4cqw calc(1.1*var(--u)) 1.6cqw;border-radius:999px;background:var(--tc);color:var(--tk);box-shadow:0 calc(1*var(--u)) calc(3*var(--u)) color-mix(in srgb,var(--tc) 32%,transparent);white-space:nowrap;max-width:44cqw;min-width:0}
.stage .turn .tn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.stage .turn .lb{font-size:calc(1.9*var(--u));letter-spacing:.14em;text-transform:uppercase;opacity:.85;line-height:1;margin-right:.4cqw}
.stage .turn.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:none}}
.stage .tmr{justify-self:end;position:relative;width:calc(13*var(--u));height:calc(13*var(--u));display:grid;place-items:center}
.stage .tmr svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.stage .tmr circle{fill:none;stroke-width:9}
.stage .tmr .trk{stroke:#ffe4ea}
.stage .tmr .bar{stroke:#e3173e;stroke-linecap:round;stroke-dasharray:276.46;transition:stroke-dashoffset .25s linear}
.stage .tmr .timer{font-family:var(--display);font-weight:900;font-size:calc(5.2*var(--u));font-variant-numeric:tabular-nums;color:#1d0b12;line-height:1}
.stage .tmr .ps{position:absolute;bottom:calc(1.2*var(--u));font-size:calc(1.5*var(--u));letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#7d5461}
.stage .tmr.off{opacity:.45}
.stage .tmr.low .timer{color:#e3173e;animation:pulse .5s infinite alternate}
.stage .tmr.low .bar{stroke:#e3173e}
.stage .tmr.done{animation:shake .5s}
.stage .tmr.done::before{content:"";position:absolute;inset:7%;border-radius:50%;background:#e3173e}
.stage .tmr.done .timer,.stage .tmr.done .ps{color:#fff;z-index:1}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-calc(1*var(--u)))}75%{transform:translateX(calc(1*var(--u)))}}
/* feedback badge */
.stage .stToast{position:absolute;left:50%;top:calc(17*var(--u));transform:translateX(-50%);z-index:6;padding:calc(1.4*var(--u)) 3cqw;border-radius:999px;font-family:var(--display);font-weight:700;font-size:calc(3.4*var(--u));color:var(--tk);background:var(--tc);box-shadow:0 calc(1.5*var(--u)) calc(4*var(--u)) rgba(29,11,18,.18);animation:toastIn .35s cubic-bezier(.2,.8,.2,1),toastOut .3s ease-in 1.3s forwards;white-space:nowrap}
.stage .stToast.ok{background:#17a36d;color:#fff}
.stage .stToast.bad{background:#1d0b12;color:#fff}
.stage .stToast.pass{background:#f59e0b;color:#fff}
.stage .stToast.time{background:#e3173e;color:#fff}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-calc(2*var(--u))) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-calc(1.5*var(--u)))}}
/* body */
.stage .body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(2.6*var(--u));min-height:0;min-width:0;text-align:center}
.stage .body>*{max-width:100%;min-width:0}
.stage .valor{font-size:calc(2.8*var(--u));font-weight:800;color:#7d5461;letter-spacing:.16em;text-transform:uppercase}
.stage .valor b{color:#e3173e}
.stage .consigna{font-family:var(--display);font-weight:700;font-size:calc(7*var(--u));line-height:1.15;max-width:92cqw;text-wrap:balance;overflow-wrap:anywhere}
.stage .letters{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(2*var(--u));max-width:94cqw}
.stage .L{width:min(calc(15*var(--u)),9.5cqw);height:min(calc(15*var(--u)),9.5cqw);border-radius:calc(3*var(--u));display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:min(calc(7.8*var(--u)),5cqw);background:#fff;border:calc(.35*var(--u)) solid #ffd6df;color:#1d0b12;position:relative;box-shadow:0 calc(.8*var(--u)) calc(2*var(--u)) rgba(227,23,62,.08);transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s,border-color .2s}
.stage .L.active{background:#e3173e;color:#fff;border-color:#e3173e;transform:scale(1.12);box-shadow:0 calc(1.4*var(--u)) calc(3.4*var(--u)) rgba(227,23,62,.38)}
.stage .L.ok{background:#17a36d;color:#fff;border-color:#17a36d;animation:popL .35s}
.stage .L.bad{background:#1d0b12;color:#fff;border-color:#1d0b12}
.stage .L.pass{background:#f59e0b;color:#fff;border-color:#f59e0b}
.stage .L .sym{position:absolute;right:calc(.8*var(--u));bottom:calc(.3*var(--u));font-size:calc(2.8*var(--u));font-family:var(--body);font-weight:800}
@keyframes popL{0%{transform:scale(.9)}50%{transform:scale(1.08)}100%{transform:none}}
.stage .pistas{display:flex;flex-direction:column;gap:calc(1.6*var(--u));width:90cqw;min-width:0}
.stage .pista>span:last-child{min-width:0;overflow-wrap:anywhere}
.stage .pista.lg{font-size:calc(3.4*var(--u))}
.stage .pista.last.lg{font-size:calc(4.2*var(--u))}
.stage .pista{display:flex;gap:2cqw;align-items:center;text-align:left;font-size:calc(4*var(--u));min-width:0;font-weight:700;padding:calc(1.8*var(--u)) 2.6cqw;border-radius:calc(2.2*var(--u));background:#fff;box-shadow:0 calc(1*var(--u)) calc(3*var(--u)) rgba(227,23,62,.08);animation:enter .45s cubic-bezier(.2,.8,.2,1);color:#7d5461}
.stage .pista.last{color:#1d0b12;font-size:calc(5*var(--u));box-shadow:0 calc(1.4*var(--u)) calc(4*var(--u)) rgba(227,23,62,.14);outline:calc(.3*var(--u)) solid #ffd6df}
.stage .pista .num{font-family:var(--display);font-weight:900;font-size:calc(3.6*var(--u));color:#e3173e;background:#fff0f3;width:calc(6.4*var(--u));height:calc(6.4*var(--u));border-radius:50%;display:grid;place-items:center;flex:none}
.stage .pista.last .num{background:#e3173e;color:#fff}
.stage .pista.locked{opacity:.7;justify-content:center;font-size:calc(3.2*var(--u));animation:none;background:#fff8f9;box-shadow:none}
.stage .dots{display:flex;gap:1cqw;align-items:center}
.stage .dots span{padding:calc(.6*var(--u)) 1.6cqw;border-radius:999px;background:#fff0f3;color:#7d5461;font-size:calc(2.4*var(--u));font-weight:800}
.stage .dots span.on{background:#e3173e;color:#fff}
.stage .dots span.off{opacity:.45;text-decoration:line-through}
.stage .emojis{display:flex;justify-content:center;align-items:center;gap:3cqw;white-space:nowrap;line-height:1;font-size:min(calc(26*var(--u)),calc((84cqw - (var(--n) - 1) * 3cqw) / var(--n) / 1.4));animation:enter .45s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 calc(1.5*var(--u)) calc(2.5*var(--u)) rgba(227,23,62,.16))}
.stage .emojis span{display:inline-block;flex:none;text-align:center;min-width:1.2em}
.stage .answer{font-family:var(--display);font-weight:900;font-size:calc(8*var(--u));color:#e3173e;animation:reveal .55s cubic-bezier(.2,.8,.2,1);text-wrap:balance;max-width:92cqw;line-height:1.08;overflow-wrap:anywhere}
@keyframes reveal{from{opacity:0;transform:scale(.9) translateY(calc(2*var(--u)));filter:blur(calc(.6*var(--u)))}to{opacity:1;transform:none;filter:none}}
.stage .sideGrid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:2cqw;height:100%;min-height:0}
.stage .sideGrid>*{min-width:0}
.stage .sideInfo{display:flex;flex-direction:column;gap:calc(2*var(--u));align-items:flex-start;text-align:left}
.stage .sideInfo .big{font-family:var(--display);font-weight:900;font-size:calc(9*var(--u));line-height:1;color:#e3173e}
.stage .sideInfo .lbl{font-size:calc(2.4*var(--u));letter-spacing:.16em;text-transform:uppercase;color:#7d5461;font-weight:800}
.stage .imgWrap{position:relative;height:calc(70*var(--u));aspect-ratio:1;max-width:60cqw;border-radius:calc(2.4*var(--u));overflow:hidden;background:#fff;box-shadow:0 calc(2*var(--u)) calc(6*var(--u)) rgba(29,11,18,.2);border:calc(.6*var(--u)) solid #fff}
.stage .imgWrap img{width:100%;height:100%;object-fit:cover;display:block}
.stage .tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.stage .tiles div{background:linear-gradient(135deg,#ff8aa5,#e3173e);border:1px solid rgba(255,255,255,.35);transition:opacity .5s,transform .5s}
.stage .tiles div.open{opacity:0;transform:scale(.6)}
/* footer scoreboard */
.stage .foot{display:flex;gap:1.6cqw;align-items:stretch;justify-content:center}
.stage .sc{flex:1;max-width:32cqw;display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:calc(1.2*var(--u)) 2.4cqw calc(1.2*var(--u)) 3.2cqw;border-radius:calc(2*var(--u));background:#fff;box-shadow:0 calc(.8*var(--u)) calc(2.4*var(--u)) rgba(227,23,62,.08),inset 1.2cqw 0 0 var(--tc);position:relative;transition:box-shadow .3s}
.stage .sc.now{box-shadow:0 calc(.8*var(--u)) calc(2.4*var(--u)) rgba(227,23,62,.08),inset 1.2cqw 0 0 var(--tc),0 0 0 calc(.4*var(--u)) var(--tc)}
.stage .sc .n{font-weight:800;font-size:calc(3.3*var(--u));line-height:1.1;min-width:0;overflow-wrap:anywhere;text-wrap:balance}
.stage .sc .n.long{font-size:calc(2.5*var(--u))}
.stage .sc .p{font-family:var(--display);font-weight:900;font-size:calc(5*var(--u));font-variant-numeric:tabular-nums;color:var(--tc);display:inline-block}
.stage .sc .p.bump{animation:bump .6s cubic-bezier(.2,.8,.2,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
/* generic screens */
.stage .center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(3*var(--u));text-align:center}
.stage .kicker{font-family:var(--serif);font-style:italic;font-size:calc(6*var(--u));color:#e3173e;line-height:1}
.stage .hero{font-family:var(--display);font-weight:900;font-size:calc(12*var(--u));line-height:.98;color:#1d0b12;text-wrap:balance;letter-spacing:-.01em;overflow-wrap:anywhere;max-width:100%}
.stage .sub{font-size:calc(3*var(--u));font-weight:800;color:#7d5461;letter-spacing:.14em;text-transform:uppercase}
.stage .split{display:grid;grid-template-columns:42cqw minmax(0,1fr);align-items:center;gap:3cqw;height:100%;min-height:0}
.stage .split>*{min-width:0;min-height:0}
.stage .photoBlob{position:relative;height:100%;min-height:0;display:flex;align-items:flex-end;justify-content:center}
.stage .photoBlob::before{content:"";position:absolute;left:50%;bottom:4%;width:38cqw;height:38cqw;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9ee,#ffbfcd)}
.stage .photoBlob::after{content:"";position:absolute;left:50%;bottom:0;width:42cqw;height:42cqw;transform:translateX(-50%);border-radius:50%;border:calc(.5*var(--u)) solid #c9a24a;opacity:.55}
.stage .photoBlob img{position:relative;height:92%;max-width:100%;object-fit:contain;filter:drop-shadow(0 calc(2*var(--u)) calc(3*var(--u)) rgba(227,23,62,.22));animation:rise .8s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(calc(3*var(--u)))}to{opacity:1;transform:none}}
.stage .chips{display:flex;gap:1.5cqw;flex-wrap:wrap}
.stage .chips .turn{font-size:calc(3.2*var(--u))}
.stage .sticker{height:calc(30*var(--u));width:auto;filter:drop-shadow(0 calc(1.5*var(--u)) calc(3*var(--u)) rgba(227,23,62,.22))}
.stage .menuGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:calc(2.4*var(--u)) 2cqw;width:88cqw}
.stage .mg{display:flex;gap:2cqw;align-items:center;text-align:left;background:#fff;border-radius:calc(2.4*var(--u));padding:calc(3*var(--u)) 2.6cqw;box-shadow:0 calc(1*var(--u)) calc(3*var(--u)) rgba(227,23,62,.08);border:calc(.35*var(--u)) solid transparent}
.stage .mg .no{font-family:var(--display);font-weight:900;font-size:calc(6.5*var(--u));color:#ffd6df;width:5cqw;flex:none;line-height:1;text-align:center}
.stage .mg.next .no{color:#e3173e}
.stage .mg .t{font-family:var(--display);font-weight:700;font-size:calc(3.8*var(--u));line-height:1.15}
.stage .mg .d{font-size:calc(2.8*var(--u));color:#7d5461;font-weight:600;margin-top:calc(.6*var(--u))}
.stage .mg.done{opacity:.45}
.stage .mg.done .t{text-decoration:line-through}
.stage .mg.next{border-color:#e3173e}
.stage .introGrid{display:grid;grid-template-columns:40cqw minmax(0,1fr);gap:4cqw;align-items:center;height:100%;min-height:0}
.stage .introGrid>*{min-width:0;min-height:0}
.stage .blocks{display:grid;grid-template-columns:1fr 1fr;gap:calc(2*var(--u)) 2cqw}
.stage .blk{background:#fff;border-radius:calc(2.2*var(--u));padding:calc(2.2*var(--u)) 2.6cqw;box-shadow:0 calc(1*var(--u)) calc(3*var(--u)) rgba(227,23,62,.07);text-align:left}
.stage .blk.wide{grid-column:1/-1}
.stage .blk .lb{font-size:calc(2.1*var(--u));letter-spacing:.16em;text-transform:uppercase;color:#e3173e;font-weight:800;margin-bottom:calc(.8*var(--u))}

function coverSrc(s){ return (s||S).config.cover || PHOTO_FULL; }
function faceSrc(s){ return (s||S).config.cover || PHOTO_FACE; }
/* color de texto legible sobre un color de equipo */
function ink(hex){ try{ const h=hex.replace('#',''); const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; const L=(0.2126*r+0.7152*g+0.0722*b)/255; return L>0.6?'#1d0b12':'#fff'; }catch(e){ return '#fff'; } }
function tstyle(t){ return `--tc:${t.color};--tk:${ink(t.color)}`; }
const SAVE_KEY = "showagus_v2";
const HB_KEY = "showagus_hb";

/* ======================================================================
   ESTADO
   ====================================================================== */
function freshGames(){ return { picapica:{card:0,letter:0,marks:{},cardDone:false}, descubrilo:ch(), queesesto:ch(), emojis:ch(), final:ch() }; }
function ch(){ return { i:0, rev:1, locked:[], solvedBy:null, pts:0, showAnswer:false, done:{} }; }
function chSnap(c){ return { rev:c.rev, locked:[...c.locked], solvedBy:c.solvedBy, pts:c.pts, showAnswer:c.showAnswer, visited:true }; }
function chGo(s,k,i){ const c=s.g[k]; const d=c.done||{}; d[c.i]=chSnap(c); s.flash=null; const saved=d[i]; s.g[k]= saved? {i, rev:saved.rev, locked:[...saved.locked], solvedBy:saved.solvedBy, pts:saved.pts, showAnswer:saved.showAnswer, done:d} : {...ch(), i, done:d}; }
function chResolved(c, n){ return !!c.solvedBy || c.locked.length>=n; }
function initialState(){
  return { v:1, phase:"setup", gi:0, config: clone(DEFAULT_CONFIG), content: clone(DEFAULT_CONTENT),
           scores:{t1:0,t2:0}, g: freshGames(), timer:{dur:30,endsAt:null,remain:30,running:false,expired:false},
           history:[], flash:null, winner:null, started:false, tb:0, order:{} };
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
let S = null, undoStack = [], bc = null, role = "panel", lastHB = 0, peerHB = 0, fixMode = false, adminOpen = false;

function migrate(s){
  const c=s.config; if(!c) return s;
  if(c.cover===undefined) c.cover=null;
  if(!c.migrated3){
    // v3: tiempos nuevos, cronómetro automático, colores de equipo distinguibles
    const old={picapica:30,descubrilo:20,queesesto:20,emojis:15}, nu={picapica:60,descubrilo:40,queesesto:40,emojis:40};
    Object.keys(nu).forEach(g=>{ if(c.games[g] && c.games[g].seconds===old[g]) c.games[g].seconds=nu[g]; });
    c.autoTimer=true; c.reboteReset=true;
    const oldCols=["#e3173e","#ff8fa8","#2a0a12","#f59e0b"];
    c.teams.forEach((t,i)=>{ if(oldCols.includes(t.color)) t.color=TEAM_COLORS[i%TEAM_COLORS.length]; });
    c.migrated3=true;
  }
  if(c.reboteReset===undefined) c.reboteReset=true;
  if(s.g) Object.keys(s.g).forEach(k=>{ if(k!=='picapica' && s.g[k] && !s.g[k].done) s.g[k].done={}; });
  if(s.content && typeof s.content.desempate==='string') s.content.desempate=[{pregunta:s.content.desempate,respuesta:''}].concat(clone(DEFAULT_CONTENT.desempate).slice(0,5));
  if(s.content && !Array.isArray(s.content.desempate)) s.content.desempate=clone(DEFAULT_CONTENT.desempate);
  if(c.shuffle===undefined) c.shuffle=true;
  if(s.content && s.content.queesesto && !s.content.chongos){ s.content.queesesto = clone(DEFAULT_CONTENT.queesesto); s.content.chongos=true; if(s.g && s.g.queesesto) s.g.queesesto=ch(); }
  ['descubrilo','queesesto','emojis','final'].forEach(g=>{ if(c.games[g] && c.games[g].seconds===20) c.games[g].seconds=40; });
  if(s.tb===undefined) s.tb=0;
  return s;
}
function load(){ try{ const r = localStorage.getItem(SAVE_KEY); if(r){ const s = JSON.parse(r); if(s && s.v===1) return migrate(s); } }catch(e){} return null; }
let saveWarned=false;
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); saveWarned=false; }catch(e){ if(!saveWarned){ saveWarned=true; toast("No se pudo guardar en este navegador (sin espacio). La partida sigue, pero no sobrevive a una recarga: exportala desde Guardar / cargar."); } } }
function broadcast(){ try{ bc && bc.postMessage({type:"state", state:S}); }catch(e){} }

/* commit: toda modificación pasa por acá → snapshot para deshacer, guardar, sincronizar, renderizar */
function commit(label, fn, opts={}){
  if(!opts.noUndo){ undoStack.push({label, snap: clone(S)}); if(undoStack.length>40) undoStack.shift(); }
  fn(S);
  if(S.flash && !S.flash.key) S.flash.key = stageKey(S);
  if(label && !opts.silent){ S.history.unshift(ts()+" · "+label); S.history = S.history.slice(0,60); }
  save(); broadcast(); render();
}
function undo(){
  const u = undoStack.pop(); if(!u){ toast("Nada para deshacer"); return; }
  S = u.snap; S.history.unshift(ts()+" · ↶ deshacer: "+u.label); save(); broadcast(); render(); toast("Deshecho: "+u.label);
}
function ts(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function teams(){ return S.config.teams; }
function team(id){ return teams().find(t=>t.id===id); }
function curKey(){ return S.config.order[S.gi]; }
function cfg(k){ return S.config.games[k]; }
function ordered(k){ const all=S.content[k]||[]; const o=S.order&&S.order[k]; if(S.config.shuffle && o && o.length===all.length) return o.map(i=>all[i]); return all; }
function shuffled(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function reshuffle(s,k){ s.order=s.order||{}; const n=(s.content[k]||[]).length; s.order[k]=shuffled(n); }
function items(k){ let all = ordered(k); if(k==='queesesto') all = all.filter(x=>x.image); const n = cfg(k).items ?? all.length; return all.slice(0, n); }
function pcCards(){ const per = cfg("picapica").cards; const all=ordered("picapica"); const total = Math.min(all.length, per*teams().length); return all.slice(0,total); }
function pcTeam(cardIdx){ return teams()[cardIdx % teams().length].id; }
function chStart(k,i){ return teams()[i % teams().length].id; }
function chAnswering(k){ // equipo que puede responder ahora (rotación desde el que arranca, salteando bloqueados)
  const c = S.g[k], n = teams().length, start = c.i % n;
  for(let j=0;j<n;j++){ const t = teams()[(start+j)%n]; if(!c.locked.includes(t.id)) return t.id; }
  return null;
}
function chPoints(k){
  const c = S.g[k], p = cfg(k).pts;
  if(Array.isArray(p)) return p[Math.min(c.rev,p.length)-1];
  return p;
}
function currentTurn(){
  const k = curKey(); if(S.phase!=="play" || !k) return null;
  if(k==="picapica") return pcTeam(S.g.picapica.card);
  if(S.g[k].solvedBy) return null;
  return chAnswering(k);
}

/* ======================================================================
   CRONÓMETRO (calcula por timestamp, sobrevive a cambios de pestaña)
   ====================================================================== */
function stopTimer(t){ const r=tRemain(t); t.remain=r; t.running=false; t.endsAt=null; return r; }
function tRemain(t){ if(!t) return 0; if(t.running && t.endsAt) return Math.max(0,(t.endsAt-Date.now())/1000); return t.remain; }
function timerStart(sec){ commit(null, s=>{ s.timer={dur:sec,endsAt:Date.now()+sec*1000,remain:sec,running:true,expired:false}; },{noUndo:true,silent:true}); }
function timerToggle(){
  const t=S.timer;
  if(t.running){ commit(null,s=>{ stopTimer(s.timer); },{noUndo:true}); }
  else if(t.remain>0 && !t.expired){ commit(null,s=>{ s.timer.endsAt=Date.now()+s.timer.remain*1000; s.timer.running=true; },{noUndo:true}); }
  else timerStart(curSeconds());
}
function timerReset(){ commit(null,s=>{ s.timer={dur:curSeconds(),endsAt:null,remain:curSeconds(),running:false,expired:false}; },{noUndo:true}); }
function curSeconds(){ const k=curKey(); return k? cfg(k).seconds : 30; }
let lastTickRender = 0;
function tick(){
  if(!S) return;
  const r = tRemain(S.timer);
  // actualizar sólo los nodos de tiempo (sin re-render completo)
  const low = S.timer.running && r<=5 && r>0, done = S.timer.expired || (S.timer.running && r<=0);
  if(role==="panel" && low){ const sec=Math.ceil(r); if(sec!==lastTickSec){ lastTickSec=sec; beep("tick"); } } else lastTickSec=null;
  document.querySelectorAll("[data-timer]").forEach(el=>{ el.textContent = fmt(r); el.classList.toggle("low", low); el.classList.toggle("done", done); });
  if(S.flash && Date.now()-S.flash.t>1700) document.querySelectorAll('.stToast').forEach(el=>el.remove());
  document.querySelectorAll("[data-tmr]").forEach(el=>{ el.classList.toggle("low", low); el.classList.toggle("done", done); el.classList.toggle("run", S.timer.running);
    const bar=el.querySelector(".bar"); if(bar){ const f = S.timer.dur? Math.max(0,Math.min(1,r/S.timer.dur)) : 0; bar.style.strokeDashoffset = (276.46*(1-f)).toFixed(1); }
    const ps=el.querySelector(".ps"); if(ps) ps.textContent = done? "tiempo" : S.timer.running? "" : (r<S.timer.dur? "pausa" : "listo"); });
  if(role==="panel" && S.timer.running && r<=0 && !S.timer.expired){
    commit(null, s=>{ s.timer.running=false; s.timer.expired=true; s.timer.remain=0; s.timer.endsAt=null; s.flash={k:'time',t:Date.now(),text:say('time',Date.now()/1000)}; },{noUndo:true});
    beep("time");
  }
}
function fmt(sec){ const s=Math.ceil(sec); return (s<10?"0":"")+s; }

/* ======================================================================
   SONIDO (sintetizado, sin archivos; sólo tras interacción)
   ====================================================================== */
let actx=null, lastTickSec=null;
function tone(t,f,d,type="triangle",vol=.22,slide){ const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.03); }
function noise(t,d,vol=.12,hp=1200){ const n=actx.sampleRate*d, b=actx.createBuffer(1,n,actx.sampleRate), ch=b.getChannelData(0); for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n); const src=actx.createBufferSource(); src.buffer=b; const f=actx.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp; const g=actx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); src.connect(f).connect(g).connect(actx.destination); src.start(t); }
function beep(kind){
  if(!S.config.sound || role!=="panel" || !kind) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime;
    if(kind==="ok"){ [523,659,784,1047].forEach((f,i)=>tone(t+i*.07,f,.22,"triangle",.22)); tone(t+.28,1047,.5,"sine",.14); noise(t+.26,.35,.06,3000); }
    else if(kind==="bad"){ tone(t,180,.28,"sawtooth",.16,120); tone(t+.05,130,.35,"square",.08,90); }
    else if(kind==="pass"){ tone(t,520,.07,"triangle",.12); tone(t+.08,420,.1,"triangle",.1); }
    else if(kind==="tick"){ tone(t,1400,.04,"square",.07); }
    else if(kind==="time"){ [0,.16,.32].forEach(d=>tone(t+d,880,.1,"square",.14)); tone(t+.5,330,.7,"sawtooth",.16,110); noise(t+.48,.5,.08,600); }
    else if(kind==="win"){ const seq=[[523,.12],[659,.12],[784,.12],[1047,.32],[784,.1],[1047,.6]]; let tt=t; seq.forEach(([f,d])=>{ tone(tt,f,d,"triangle",.22); tone(tt,f/2,d,"sine",.1); tt+=d*.9; }); for(let i=0;i<10;i++) noise(t+.9+i*.11,.28,.05,800); }
  }catch(e){}
}

function startShow(){
  if(!S.config.order.length){ toast('Activá al menos una ronda'); return; }
  commit("Inicio del show", s=>{ s.phase="lobby"; s.started=true; s.gi=0; s.scores={}; teams().forEach(t=>s.scores[t.id]=0); s.g=freshGames(); s.winner=null; s.roundBase={}; s.tb=0; s.order={}; Object.keys(GAMES).forEach(k=>reshuffle(s,k)); });
}
function gotoIntro(gi){ commit("Instrucciones: "+GAMES[S.config.order[gi]].name, s=>{ s.gi=gi; s.phase="intro"; s.timer={dur:cfg(s.config.order[gi]).seconds,endsAt:null,remain:cfg(s.config.order[gi]).seconds,running:false,expired:false}; }); }
function startRound(){ const k=curKey(); if(!S.roundBase) S.roundBase={}; const needBase = S.roundBase[S.gi]===undefined; const base=clone(S.scores); const resolved = k==="picapica" ? !!S.g.picapica.cardDone : chResolved(S.g[k],teams().length); commit("Arranca "+GAMES[k].name, s=>{ if(needBase){ s.roundBase=s.roundBase||{}; s.roundBase[s.gi]=base; } s.phase="play"; s.timer={dur:curSeconds(),endsAt:null,remain:curSeconds(),running:false,expired:false}; }); if(S.config.autoTimer && !resolved) timerStart(curSeconds()); }
function endRound(){ commit("Fin de "+GAMES[curKey()].name, s=>{ s.phase="round"; stopTimer(s.timer); }); beep("win"); }
function nextGame(){
  const next = S.gi+1;
  if(next < S.config.order.length) { commit("Menú de juegos", s=>{ s.gi=next; s.phase="menu"; }); }
  else commit("Resultados finales", s=>{ s.phase="final"; s.winner=computeWinner(s); });
}
function gamePoints(s,k){ // puntos otorgados por un juego, por equipo
  const out={}; const add=(t,n)=>{ if(t) out[t]=(out[t]||0)+n; };
  if(k==="picapica"){ const g=s.g.picapica, pts=s.config.games.picapica.pts; const n=s.config.teams.length; Object.keys(g.marks||{}).forEach(ci=>{ const okN=Object.values(g.marks[ci]).filter(v=>v==="ok").length; add(s.config.teams[ci%n].id, okN*pts); }); }
  else { const c=s.g[k]; if(!c) return out; add(c.solvedBy,c.pts); Object.keys(c.done||{}).forEach(i=>{ if(+i!==c.i){ add(c.done[i].solvedBy,c.done[i].pts); } }); }
  return out;
}
function resetGame(k){
  commit("Reinicia "+GAMES[k].name, s=>{ const pts=gamePoints(s,k); Object.keys(pts).forEach(t=>{ s.scores[t]=(s.scores[t]||0)-pts[t]; }); s.g[k]= k==="picapica"? {card:0,letter:0,marks:{},cardDone:false} : ch(); reshuffle(s,k); const gi=s.config.order.indexOf(k); if(s.roundBase && gi>=0) delete s.roundBase[gi]; if(s.phase==="play" && s.config.order[s.gi]===k){ s.phase="menu"; stopTimer(s.timer); } });
  confirmKey=null; toast(GAMES[k].name+" reiniciado: consignas mezcladas de nuevo y puntos de ese juego descontados");
}
let confirmKey=null;
function computeWinner(s){
  const max = Math.max(...s.config.teams.map(t=>s.scores[t.id]||0));
  const tops = s.config.teams.filter(t=>(s.scores[t.id]||0)===max);
  return tops.length===1 ? tops[0].id : null;
}
function tiebreakWin(id){ commit('Gana el desempate: '+team(id).name, s=>{ s.scores[id]++; s.phase='final'; s.winner=computeWinner(s); s.flash={k:'ok',t:Date.now(),text:'¡'+team(id).name+' gana el desempate!',team:id}; }); beep('win'); }
function addScore(id, n, label){ commit(label||((n>0?"+":"")+n+" a "+team(id).name), s=>{ s.scores[id]=(s.scores[id]||0)+n; }); }
function setScore(id, n){ commit("Puntaje de "+team(id).name+" = "+n, s=>{ s.scores[id]=n; }); }

/* Pica Pica */
function pcMark(letter, mark){
  const c=S.g.picapica, card=pcCards()[c.card], tid=pcTeam(c.card), pts=cfg("picapica").pts;
  const prev = (c.marks[c.card]||{})[letter];
  if(prev===mark) return;
  const delta = (mark==="ok"?pts:0) - (prev==="ok"?pts:0);
  commit(`${letter}: ${mark==="ok"?"✓":mark==="bad"?"✗":"pasa"} (${team(tid).name})`, s=>{
    const m = s.g.picapica.marks[s.g.picapica.card] = s.g.picapica.marks[s.g.picapica.card]||{};
    m[letter]=mark; s.scores[tid]+=delta;
    // avanzar a la siguiente letra sin marcar
    const idx = card.letras.indexOf(letter);
    let nxt = card.letras.findIndex((L,i)=>i>idx && !m[L]);
    if(nxt<0) nxt = card.letras.findIndex(L=>!m[L]);
    s.g.picapica.letter = nxt<0 ? idx : nxt;
    s.flash = {k:mark, t:Date.now(), text: mark==='ok'? say('ok',Date.now()/1000) : mark==='bad'? say('bad',Date.now()/1000) : 'Paso', team: mark==='ok'? tid : null};
    if(nxt<0){ s.g.picapica.cardDone=true; (s.g.picapica.closed=s.g.picapica.closed||{})[s.g.picapica.card]=true; stopTimer(s.timer); }
  });
  beep(mark==="ok"?"ok":mark==="bad"?"bad":"pass");
}
function pcActiveLetter(){ const c=S.g.picapica; return pcCards()[c.card].letras[c.letter]; }
function pcEndTurn(){ commit("Cierra la tarjeta "+(S.g.picapica.card+1), s=>{ s.g.picapica.cardDone=true; (s.g.picapica.closed=s.g.picapica.closed||{})[s.g.picapica.card]=true; stopTimer(s.timer); }); }
function pcNext(){
  const total = pcCards().length;
  if(S.g.picapica.card+1 >= total){ endRound(); return; }
  commit("Siguiente tarjeta", s=>{ (s.g.picapica.closed=s.g.picapica.closed||{})[s.g.picapica.card]=true; s.g.picapica.card++; const m=s.g.picapica.marks[s.g.picapica.card]||{}; const card=withS(s,pcCards)[s.g.picapica.card]; const first=card.letras.findIndex(L=>!m[L]); s.g.picapica.letter=first<0?0:first; s.g.picapica.cardDone = first<0 || !!s.g.picapica.closed[s.g.picapica.card]; s.timer={dur:curSeconds(),endsAt:null,remain:curSeconds(),running:false,expired:false}; });
  if(S.config.autoTimer && !S.g.picapica.cardDone) timerStart(curSeconds());
}
function pcPrev(){ if(S.g.picapica.card===0) return; commit("Tarjeta anterior", s=>{ s.g.picapica.card--; const m=s.g.picapica.marks[s.g.picapica.card]||{}; const card=withS(s,pcCards)[s.g.picapica.card]; const first=card.letras.findIndex(L=>!m[L]); s.g.picapica.letter=first<0?0:first; s.g.picapica.cardDone = first<0 || !!s.g.picapica.closed?.[s.g.picapica.card]; stopTimer(s.timer); }); }

/* Descubrilo / Qué es esto / Emojis / Final (modelo común) */
function chReveal(k){ const max = k==="descubrilo"? 3 : k==="queesesto"? 4 : 1; if(S.g[k].rev>=max) return; commit(k==="queesesto"?"Revela etapa "+(S.g[k].rev+1):"Pista "+(S.g[k].rev+1), s=>{ s.g[k].rev++; }); }
function chCorrect(k, tid){
  const c=S.g[k]; if(c.solvedBy===tid) return;
  if(c.solvedBy && !fixMode) return;
  const pts = c.solvedBy ? c.pts : chPoints(k);
  commit(c.solvedBy? `Corrige: ✓ ${team(tid).name} +${pts} (antes ${team(c.solvedBy).name})` : `✓ ${team(tid).name} +${pts} (${GAMES[k].short})`, s=>{ if(s.g[k].solvedBy){ s.scores[s.g[k].solvedBy]-=s.g[k].pts; } s.g[k].locked=s.g[k].locked.filter(x=>x!==tid); s.g[k].solvedBy=tid; s.g[k].pts=pts; s.scores[tid]+=pts; s.g[k].showAnswer=true; stopTimer(s.timer); s.flash={k:"ok",t:Date.now(),text:say('ok',Date.now()/1000)+" +"+pts,team:tid}; if(k==="queesesto") s.g[k].rev=4; });
  fixMode=false; beep("ok");
}
function chWrong(k){
  const c=S.g[k], tid=chAnswering(k); if(!tid||c.solvedBy) return;
  commit(`✗ ${team(tid).name} (${GAMES[k].short})`, s=>{
    s.g[k].locked.push(tid);
    const nxt = cfg(k).rebote ? chAnswering(k) : null;
    s.flash={k:"bad",t:Date.now(),text: nxt? say('bad',Date.now()/1000)+" Rebota: "+team(nxt).name : say('bad',Date.now()/1000), team:null, pop:true};
    if(!nxt){ /* nadie más puede: se cierra */ s.g[k].locked = teams().map(t=>t.id); stopTimer(s.timer); }
    else if(s.config.autoTimer && s.config.reboteReset){ s.timer={dur:curSeconds(),endsAt:Date.now()+curSeconds()*1000,remain:curSeconds(),running:true,expired:false}; }
  });
  beep("bad");
}
function chNobody(k){ commit("Nadie la sacó ("+GAMES[k].short+")", s=>{ if(s.g[k].solvedBy){ s.scores[s.g[k].solvedBy]-=s.g[k].pts; s.g[k].solvedBy=null; s.g[k].pts=0; } s.g[k].locked=teams().map(t=>t.id); s.g[k].showAnswer=true; stopTimer(s.timer); if(k==="queesesto") s.g[k].rev=4; }); fixMode=false; }
function chShowAnswer(k){ commit("Revela respuesta", s=>{ s.g[k].showAnswer=true; if(k==="queesesto") s.g[k].rev=4; }); }
function chNext(k){
  const total = items(k).length;
  if(S.g[k].i+1 >= total){ endRound(); return; }
  commit("Siguiente ("+GAMES[k].short+")", s=>{ chGo(s,k,s.g[k].i+1); s.timer={dur:curSeconds(),endsAt:null,remain:curSeconds(),running:false,expired:false}; });
  fixMode=false;
  if(S.config.autoTimer && !chResolved(S.g[k],teams().length)) timerStart(curSeconds());
}
function chPrev(k){ if(S.g[k].i===0) return; commit("Anterior ("+GAMES[k].short+")", s=>{ chGo(s,k,s.g[k].i-1); stopTimer(s.timer); s.timer.expired=false; }); fixMode=false; }

/* ---------- vista pública ---------- */
function scoreboardHTML(s){
  const turn = currentTurnFor(s);
  const bump = s.flash && s.flash.k==='ok' && s.flash.team && Date.now()-s.flash.t<1200 ? s.flash.team : null;
  return `<div class="foot">${s.config.teams.map(t=>`<div class="sc ${turn===t.id?'now':''}" style="${tstyle(t)}"><span class="n ${t.name.length>16?'long':''}">${esc(t.name)}</span><span class="p ${bump===t.id?'bump':''}">${s.scores[t.id]||0}</span></div>`).join("")}</div>`;
}
function currentTurnFor(s){ const keep=S; S=s; const r=currentTurn(); S=keep; return r; }
function withS(s, fn){ const keep=S; S=s; try{ return fn(); } finally{ S=keep; } }
function brandHTML(s, gameName, noImg){
  return `<div class="brand">${noImg?'':`<img src="${faceSrc(s)}" alt="">`}<div style="min-width:0"><div class="wm">el show de Agustina</div><div class="gn">${esc(gameName)}</div></div></div>`;
}
function stageResolved(s){ const k=s.config.order[s.gi]; if(s.phase!=="play"||!k) return false; if(k==="picapica") return !!s.g.picapica.cardDone; const c=s.g[k]; return !!c.solvedBy || c.locked.length>=s.config.teams.length; }
function timerRingHTML(s){
  const r=tRemain(s.timer), f = s.timer.dur? Math.max(0,Math.min(1,r/s.timer.dur)) : 0;
  const done = s.timer.expired, low = s.timer.running && r<=5 && r>0, off = stageResolved(s) && !s.timer.running;
  if(off) return `<div class="tmr off" data-tmr-off><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="44"></circle></svg><span class="timer" style="font-size:calc(3.2*var(--u))">✓</span><span class="ps">resuelta</span></div>`;
  return `<div class="tmr ${done?'done':''} ${low?'low':''} ${s.timer.running?'run':''}" data-tmr><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="44"></circle><circle class="bar" cx="50" cy="50" r="44" style="stroke-dashoffset:${(276.46*(1-f)).toFixed(1)}"></circle></svg><span class="timer" data-timer>${fmt(r)}</span><span class="ps">${done?'tiempo':s.timer.running?'':(r<s.timer.dur?'pausa':'listo')}</span></div>`;
}
function turnPill(s, t, pop){ return `<div class="turn ${pop?'pop':''}" style="${tstyle(t)}"><span class="lb">le toca a</span><span class="tn">${esc(t.name)}</span></div>`; }
function hdrHTML(s, name, showTimer){
  const turn = currentTurnFor(s); const t = turn? s.config.teams.find(x=>x.id===turn):null;
  const pop = s.flash && s.flash.pop && Date.now()-s.flash.t<800;
  return `<div class="hdr">${brandHTML(s,name)}${t?turnPill(s,t,pop):`<div></div>`}${showTimer?timerRingHTML(s):`<div></div>`}</div>`;
}
function emojiRow(str){ const parts=str.split(/\s+/).filter(Boolean); return `<div class="emojis" style="--n:${parts.length}">${parts.map(e=>`<span>${esc(e)}</span>`).join("")}</div>`; }
function fitSize(text, big, mid, small, tiny, b1=14, b2=28, b3=44){ const n=(text||"").length; return n<=b1? big : n<=b2? mid : n<=b3? small : tiny; }
function answerHTML(text, extra){ return `<div class="answer" style="font-size:calc(${fitSize(text,8.5,7,5.6,4.4)}*var(--u));${extra||''}">${esc(text)}</div>`; }
function consignaHTML(text){ return `<div class="consigna" style="font-size:calc(${fitSize(text,7.4,7,6,5,22,36,56)}*var(--u))">${esc(text)}</div>`; }
function teamChips(s){ return `<div class="chips">${s.config.teams.map(t=>`<div class="turn" style="${tstyle(t)}"><span class="tn">${esc(t.name)}</span></div>`).join("")}</div>`; }
let lastStageKey = null;
function stageKey(s){ const k=s.config.order[s.gi]; const idx = s.phase==="play" && k ? (k==="picapica"? s.g.picapica.card : s.g[k].i) : 0; return s.phase+"|"+s.gi+"|"+idx; }
function stageHTML(s){
  const k = s.config.order[s.gi]; let body="";
  const key = stageKey(s); const enter = key!==lastStageKey; lastStageKey = key;
  const fl = s.flash && Date.now()-s.flash.t<1700 && s.flash.key===key ? s.flash : null;

    if(isFinal){
      body = `<canvas class="conf"></canvas><div class="split"><div class="photoBlob"><img src="${coverSrc(s)}" alt="Agustina"></div>

      ${emojiRow(it.emojis)}${c.showAnswer?answerHTML(it.respuesta):closed?`<div class="valor">Nadie la sacó</div>`:''}</div>`;
  } else if(k==="final"){
    body = `<div class="body"><div class="valor">Pregunta <b>${c.i+1}</b> · vale <b>${pts}</b> puntos</div>${consignaHTML(it.pregunta)}${c.showAnswer?answerHTML(it.respuesta||"(sin respuesta cargada)"):''}</div>`;
  }
  return wrap(`${hdrHTML(s,GAMES[k].hdr||GAMES[k].name,true)}${body}${scoreboardHTML(s)}`);

function tileOrder(seed){ // estable por ítem: primero el borde (menos información), el centro al final
  const edge=[0,1,2,3,4,7,8,11,12,13,14,15], mid=[5,6,9,10]; let x=(seed+7)*2654435761>>>0;
  const sh=a=>{ for(let i=a.length-1;i>0;i--){ x=(x*1664525+1013904223)>>>0; const j=x%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  return [...sh(edge), ...sh(mid)];
}
function burstFx(canvas){
  if(canvas._on) return; canvas._on=true; if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx=canvas.getContext("2d"); const W=canvas.width=canvas.offsetWidth||800, H=canvas.height=canvas.offsetHeight||450;
  const col=canvas.dataset.c||'#17a36d', cols=[col,'#ffffff','#e3173e','#ffd6df'];
  const start=+canvas.dataset.t||Date.now(); const age0=Date.now()-start; if(age0>900) return;
  const P=Array.from({length:Math.round(W/10)},()=>{ const a=-Math.PI/2+(Math.random()-.5)*1.6, v=W*(0.35+Math.random()*0.5); return {x:W/2,y:H*0.28,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:W/220+Math.random()*W/160,c:cols[Math.random()*cols.length|0],rot:Math.random()*6}; });
  (function f(){ if(!canvas.isConnected) return; const age=(Date.now()-start)/1000; if(age>1.1) { ctx.clearRect(0,0,W,H); return; } ctx.clearRect(0,0,W,H);
    P.forEach(p=>{ const x=p.x+p.vx*age, y=p.y+p.vy*age+0.5*(W*1.6)*age*age; ctx.globalAlpha=Math.max(0,1-age/1.1); ctx.fillStyle=p.c; ctx.save(); ctx.translate(x,y); ctx.rotate(p.rot+age*6); ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }); ctx.globalAlpha=1; requestAnimationFrame(f); })();
}
function confetti(canvas){
  if(canvas._on) return; canvas._on=true;
  const ctx=canvas.getContext("2d"); const W=canvas.width=canvas.offsetWidth||800, H=canvas.height=canvas.offsetHeight||450;
  const P=Array.from({length:Math.round(W/7)},()=>({x:Math.random()*W,y:-Math.random()*H,r:W/160+Math.random()*(W/110),c:["#e3173e","#ff6b8a","#ffc9d6","#1d0b12","#f5b800"][Math.random()*5|0],v:1+Math.random()*3,a:Math.random()*6}));
  let frames=0; const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function f(){ if(!canvas.isConnected || frames++>900 || reduce) return; ctx.clearRect(0,0,W,H); P.forEach(p=>{ p.y+=p.v; p.a+=.1; if(p.y>H) p.y=-10; ctx.fillStyle=p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }); requestAnimationFrame(f); })();
}

function estimate(){ const c=S.config; let m=5; c.order.forEach(g=>{ const n = g==='picapica'? c.games[g].cards*c.teams.length : c.games[g].items; m += n*(c.games[g].seconds+25)/60; }); return Math.round(m+4); }

function chControls(k){
  const c=S.g[k], list=items(k), it=list[c.i], ans=chAnswering(k), maxRev = k==="descubrilo"?3:k==="queesesto"?4:1, isLast=c.i+1>=list.length;
  if(!it) return `<div class="card stack"><h3>${esc(GAMES[k].name)}</h3><div class="hint warn">No hay chongos con foto. Subilas en Juegos y preguntas → El chongo (con un nombre y una foto por tarjeta) y volvé a entrar al juego.</div><div class="row"><button class="primary" onclick="modal={type:'contenido',tab:'queesesto'};render()">Subir fotos</button><button class="ghost" onclick="gotoMenu()">☰ Menú</button></div></div>`;
  const closed = c.locked.length>=teams().length && !c.solvedBy;
  const label = k==="descubrilo"?"pista":k==="queesesto"?"etapa":null;
  const pos = k==="emojis"?`Película ${c.i+1} de ${list.length}`:k==="final"?`Pregunta ${c.i+1} de ${list.length}`:k==="queesesto"?`Chongo ${c.i+1} de ${list.length}`:`${c.i+1} de ${list.length}`;
  const resolved = (c.solvedBy || closed) && !fixMode;
  const revisit = (c.done||{})[c.i] && (c.done[c.i].visited);
  return `<div class="card stack">
    ${statusHTML(k,pos, chProgress(k), resolved ? (isLast?'Resuelta. Terminá la ronda con N.':'Resuelta. Siguiente con N.') : fixMode ? 'Elegí el resultado correcto.' : closed ? 'Nadie la sacó: mostrá la respuesta o seguí.' : `Responde ${esc(ans?team(ans).name:'')}: Bien (1) o Mal (2).${label&&c.rev<maxRev?' Si piden ayuda, mostrá la próxima '+label+' (P).':''}`)}
    ${S.timer.expired && !resolved && !c.solvedBy && !closed ? `<div class="hint warn">Se acabó el tiempo. Si no respondieron, marcá Mal (rebota) o Nadie.</div>`:''}
    ${fixMode?`<div class="hint warn">Corrigiendo el resultado: elegí el equipo correcto o «Nadie». Los puntos se reacomodan solos.</div>`:''}
    ${k==="emojis"?`<div style="font-size:40px;text-align:center;line-height:1.2;letter-spacing:.1em">${esc(it.emojis)}</div>`:k==="final"?`<div style="font-weight:800;font-size:18px">${esc(it.pregunta)}</div>`:""}
    ${label?`<div class="row between"><div class="steps" style="flex:1">${Array.from({length:maxRev},(_,i)=>`<span class="${i<c.rev?'on':''}"></span>`).join("")}</div><span class="muted" style="font-size:13px">${label} ${c.rev} de ${maxRev} · vale <b>${chPoints(k)}</b></span></div>`:''}
    ${resolved
      ? `<div class="row between"><span>${c.solvedBy?`<span class="tag ok">✓ ${esc(team(c.solvedBy).name)} +${c.pts}</span>`:`<span class="tag dark">Nadie la sacó</span>`} ${revisit?`<span class="tag">ya jugada</span>`:''}</span><span class="row">${!c.showAnswer?`<button class="small" onclick="chShowAnswer('${k}')">Mostrar respuesta en pantalla <kbd>3</kbd></button>`:''}<button class="link small" onclick="fixMode=true;render()">Corregir</button></span></div>
         <button class="primary xl" onclick="chNext('${k}')">${isLast?'Terminar la ronda →':'Siguiente →'} <kbd>N</kbd></button>`
      : fixMode
      ? `<div class="row">${teams().map(t=>`<button class="ok" style="flex:1" onclick="chCorrect('${k}','${t.id}')" ${c.solvedBy===t.id?'disabled':''}>✓ ${esc(t.name)} ${c.solvedBy===t.id?'(actual)':''}</button>`).join("")}<button class="bad" onclick="chNobody('${k}')">Nadie</button><button class="ghost" onclick="fixMode=false;render()">Cancelar</button></div>`
      : `<div class="big2"><button class="ok" onclick="chCorrect('${k}','${ans}')">✓ Bien<small>+${chPoints(k)} para ${esc(ans?team(ans).name:'')} <kbd>1</kbd></small></button><button class="bad" onclick="chWrong('${k}')">✗ Mal<small>${cfg(k).rebote&&teams().length>1?'rebota al otro equipo':'se cierra la consigna'} <kbd>2</kbd></small></button></div>
         <div class="row">${label?`<button class="${c.rev<maxRev?'primary':''}" style="flex:1" onclick="chReveal('${k}')" ${c.rev>=maxRev?'disabled':''}>${c.rev<maxRev?`Mostrar ${label} ${c.rev+1} · pasa a valer ${chPointsAt(k,c.rev+1)}`:`No quedan ${label}s`} <kbd>P</kbd></button>`:''}<button class="ghost" onclick="chNobody('${k}')">Nadie la sacó <kbd>3</kbd></button></div>
         ${teams().length>2?`<div class="row" style="font-size:12px"><span class="muted">Acertó otro equipo:</span>${teams().filter(t=>t.id!==ans).map(t=>`<button class="small ghost" onclick="chCorrect('${k}','${t.id}')">✓ ${esc(t.name)}</button>`).join("")}</div>`:''}`}
    <div class="private ${S.config.singleScreen?'peek':''}"><div class="lbl"><span>Respuesta</span>${k==="emojis"&&it.acepta.length?`<span>también vale: ${esc(it.acepta.join(", "))}</span>`:it.demo?`<span>imagen generada por IA, pendiente de reemplazar</span>`:''}</div><div class="ans">${esc(k==="final"?(it.respuesta||"(sin cargar)"):it.respuesta)}</div>
      ${k==="descubrilo"?`<ol class="list" style="margin:6px 0 0;padding-left:18px;font-size:13px">${it.pistas.map((p,i)=>`<li style="${i<c.rev?'':'opacity:.5'}">${esc(p)}</li>`).join("")}</ol>`:''}</div>
  </div>
  <div class="card stack">${resolved?resolvedBarHTML():timerBarHTML()}${navRow(`chPrev('${k}')`, `chNext('${k}')`, c.i>0, isLast, resolved)}</div>
  <div class="hotkeys"><kbd>1</kbd> bien · <kbd>2</kbd> mal · <kbd>3</kbd> nadie / revelar${label?` · <kbd>P</kbd> ${label}`:''} · <kbd>N</kbd> siguiente · <kbd>espacio</kbd> pausa · <kbd>Z</kbd> deshacer · <kbd>M</kbd> menú</div>`;
}

    const bar = tab==='desempate' ? `<div class="bar"><span>Si hay empate al final, se hace una pregunta con respuesta numérica. Gana el equipo que más se acerca. Si vuelven a empatar, se pasa a la siguiente.</span></div>`
      : `<div class="bar"><div style="flex:1;min-width:0"><div style="font-weight:800">${esc(g.name)}</div><div class="muted" style="font-size:13px">${esc(g.desc)}</div></div>
         <label class="chk" style="font-size:13px;white-space:nowrap">${tab==='picapica'?'Tarjetas por equipo':'Se juegan'} <input type="number" min="1" max="${tab==='picapica'?10:Math.max(1,playable)}" value="${tab==='picapica'?cfgG.cards:Math.min(cfgG.items,Math.max(1,playable))}" onchange="setCfg('${tab}','${tab==='picapica'?'cards':'items'}',Math.max(1,+this.value))"> ${tab==='picapica'?'':'de '+playable}${tab==='queesesto'&&playable<list.length?` <span class="muted">(${list.length-playable} sin foto)</span>`:''}</label>
         <span class="muted" style="font-size:12px;white-space:nowrap">${S.config.shuffle?'Al azar en cada show':'En este orden'}</span></div>`;
    const items = list.map((it,i)=>itemHTML(tab,it,i,list.length)).join("");
    main = bar+`<div class="items ${tab==='picapica'?'one':''}" style="margin:10px 0">${items||'<p class="muted">Todavía no hay nada acá.</p>'}</div><div class="row"><button class="primary" onclick="addItem('${tab}')">+ Agregar</button></div>`;
  }
  return `<h3>Juegos y preguntas</h3><div class="edGrid" style="margin-top:10px">${nav}<div style="min-width:0">${main}</div></div>`;
}
function itemHTML(k,it,i,n){
  const hd=(title)=>`<div class="hd"><span class="no">${i+1}</span><span class="sp">${title||''}</span>${i>0?`<button class="small ghost" title="Subir" onclick="moveItem('${k}',${i},-1)">↑</button>`:''}${i<n-1?`<button class="small ghost" title="Bajar" onclick="moveItem('${k}',${i},1)">↓</button>`:''}${confirmKey===k+':'+i?`<span class="row" style="font-size:12px">¿Borrar?<button class="small danger" onclick="delItem('${k}',${i})">Sí</button><button class="small ghost" onclick="confirmKey=null;render()">No</button></span>`:`<button class="small ghost" title="Borrar" onclick="confirmKey='${k}:${i}';render()">✕</button>`}</div>`;
  const inp=(f,val,ph,cls='')=>`<input type="text" class="${cls}" value="${esc(val||'')}" placeholder="${ph}" onchange="setItem('${k}',${i},'${f}',this.value)">`;
  if(k==='picapica') return `<div class="item">${hd()}<label class="f">Consigna${inp('consigna',it.consigna,'Cosas que no pueden faltar en una fiesta','lg')}</label>
    <label class="f">Letras (separadas por coma)${inp('letras',(it.letras||[]).join(', '),'A, B, C, D, F, G, M, P')}</label>
    <div class="f"><span>Palabras sugeridas (privadas, para quien conduce)</span><div class="grid4">${(it.letras||[]).map(L=>`<label><b>${L}</b><input type="text" value="${esc((it.sugeridas||{})[L]||'')}" onchange="setSug('${k}',${i},'${L}',this.value)"></label>`).join("")}</div></div></div>`;
  if(k==='descubrilo') return `<div class="item">${hd()}<label class="f">Respuesta${inp('respuesta',it.respuesta,'Titanic','lg')}</label>
    ${[0,1,2].map(p=>`<label class="f">Pista ${p+1} ${p===0?'(la más difícil)':p===2?'(la más obvia)':''}<input type="text" value="${esc((it.pistas||[])[p]||'')}" onchange="setPista('${k}',${i},${p},this.value)"></label>`).join("")}</div>`;
  if(k==='queesesto') return `<div class="item photo ${it.image?'':'nophoto'}">${hd(it.image?'':'<span class="tag">falta la foto</span>')}<div style="display:grid;gap:6px;justify-items:center">${it.image?`<img src="${it.image}" alt="">`:`<div class="ph"><svg viewBox="0 0 64 64" width="56" height="56" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="32" cy="22" r="11"/><path d="M10 56c3-12 11-18 22-18s19 6 22 18"/></svg></div>`}<label class="filebtn">${it.image?'Cambiar foto':'Subir foto'}<input type="file" accept="image/*" class="hidden" onchange="loadImage(${i},this.files[0])"></label></div>
    <div class="stack"><label class="f">Nombre (así se muestra al revelar)${inp('respuesta',it.respuesta,'Brad Pitt','lg')}</label><p class="muted" style="margin:0;font-size:12px">Mejor una foto de la cara, de frente y bien iluminada. Se recorta al cuadrado automáticamente; los ojos y la boca se destapan al final.</p></div></div>`;
  if(k==='emojis') return `<div class="item">${hd()}<label class="f">Emojis (separados por espacio)${inp('emojis',it.emojis,'🚢 🧊 💑','emo')}</label><div class="grid2"><label class="f">Película${inp('respuesta',it.respuesta,'Titanic','lg')}</label><label class="f">También vale (coma)${inp('acepta',(it.acepta||[]).join(', '),'The Notebook')}</label></div></div>`;
  if(k==='final') return `<div class="item">${hd()}<label class="f">Pregunta${inp('pregunta',it.pregunta,'¿Dónde se conocieron?','lg')}</label><label class="f">Respuesta (confirmada con la novia)${inp('respuesta',it.respuesta,'')}</label></div>`;
  if(k==='desempate') return `<div class="item">${hd()}<label class="f">Pregunta con respuesta numérica${inp('pregunta',it.pregunta,'¿Cuántos invitados hay en la boda?','lg')}</label><label class="f">Respuesta${inp('respuesta',it.respuesta,'120')}</label></div>`;
  return '';
}
function setItem(k,i,f,v){
  commit(null, s=>{ const it=s.content[k][i]; if(f==='letras'){ it.letras=v.split(/[,\s]+/).map(x=>x.trim().toUpperCase()).filter(Boolean); it.sugeridas=it.sugeridas||{}; } else if(f==='acepta'){ it.acepta=v.split(',').map(x=>x.trim()).filter(Boolean); } else it[f]=v; }, {noUndo:true, silent:true});
}
function setSug(k,i,L,v){ commit(null, s=>{ const it=s.content[k][i]; it.sugeridas=it.sugeridas||{}; it.sugeridas[L]=v; }, {noUndo:true, silent:true}); }
function setPista(k,i,p,v){ commit(null, s=>{ const it=s.content[k][i]; it.pistas=it.pistas||['','','']; it.pistas[p]=v; }, {noUndo:true, silent:true}); }
function addItem(k){
  const blank = {picapica:{consigna:'',letras:['A','B','C','D','E','F','G','H'],sugeridas:{}}, descubrilo:{respuesta:'',pistas:['','','']}, queesesto:null, emojis:{emojis:'',respuesta:'',acepta:[]}, final:{pregunta:'',respuesta:''}, desempate:{pregunta:'',respuesta:''}}[k];
  if(!blank){ commit('Agrega chongo', s=>{ s.content.queesesto.push({respuesta:'',image:''}); }); return; }
  commit('Agrega consigna en '+(GAMES[k]?GAMES[k].short:'Desempate'), s=>{ s.content[k].push(blank); reshuffle(s,k); });
}
function delItem(k,i){ commit('Borra consigna '+(i+1)+' de '+(GAMES[k]?GAMES[k].short:'Desempate'), s=>{ s.content[k].splice(i,1); if(GAMES[k] && k!=='picapica' && s.config.games[k].items>s.content[k].length) s.config.games[k].items=Math.max(1,s.content[k].length); reshuffle(s,k); if(k!=='desempate' && s.g[k]){ s.g[k]= k==='picapica'? {card:0,letter:0,marks:{},cardDone:false} : ch(); } }); confirmKey=null; }
function moveItem(k,i,d){ commit(null, s=>{ const a=s.content[k]; const j=i+d; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; }, {noUndo:true, silent:true}); }
function downloadState(){
  const data=JSON.stringify(S); const name='show-de-agustina-'+new Date().toISOString().slice(0,10)+'.json'; const msg=document.getElementById('dlmsg');
  try{ const blob=new Blob([data],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },500);
    if(msg){ msg.textContent='Si no se descargó (pasa dentro de claude.ai), usá «Copiar al portapapeles» y pegalo en un archivo de texto.'; msg.className='muted'; } }
  catch(e){ if(msg) msg.textContent='No se pudo descargar: usá «Copiar al portapapeles».'; }
}
function answerSheet(){
  const C=S.content; let out="HOJA DE RESPUESTAS — Show de Agustina\n\n== PICA PICA ==\n";
  C.picapica.forEach((c,i)=>{ out+=`${i+1}. ${c.consigna}\n   `+c.letras.map(L=>`${L}: ${c.sugeridas[L]||'—'}`).join(" · ")+"\n"; });
  out+="\n== DESCUBRILO ==\n"; C.descubrilo.forEach((d,i)=>{ out+=`${i+1}. ${d.respuesta}\n   1) ${d.pistas[0]}\n   2) ${d.pistas[1]}\n   3) ${d.pistas[2]}\n`; });
  out+="\n== ¿QUIÉN ES EL CHONGO? ==\n"; C.queesesto.forEach((q,i)=>{ out+=`${i+1}. ${q.respuesta}${q.image?'':' (sin foto)'}\n`; });
  out+="\n== EMOJIS ==\n"; C.emojis.forEach((e,i)=>{ out+=`${i+1}. ${e.emojis} → ${e.respuesta}${e.acepta.length?' (también: '+e.acepta.join(', ')+')':''}\n`; });
  out+="\n== GRAN FINAL ==\n"; C.final.forEach((f,i)=>{ out+=`${i+1}. ${f.pregunta} → ${f.respuesta||'(sin cargar)'}\n`; });
  out+="\n== DESEMPATE ==\n"; (C.desempate||[]).forEach((d,i)=>{ out+=`${i+1}. ${d.pregunta} → ${d.respuesta||'(sin cargar)'}\n`; }); return out;
}
function applyContent(){
  const msg=document.getElementById("cmsg");
  try{ const c=JSON.parse(document.getElementById("cjson").value); validateContent(c);
    commit("Contenido actualizado", s=>{ s.content=c; Object.keys(GAMES).forEach(g=>{ if(g!=="picapica" && s.config.games[g].items> (c[g]||[]).length) s.config.games[g].items=(c[g]||[]).length; reshuffle(s,g); }); });
    msg.textContent="Aplicado ✓"; msg.style.color="var(--ok)";
  }catch(e){ msg.textContent="Error: "+e.message; msg.style.color="var(--bad)"; }
}
function validateContent(c){
  if(!Array.isArray(c.picapica)||!c.picapica.length) throw new Error("picapica debe ser una lista con al menos 1 tarjeta");
  c.picapica.forEach((x,i)=>{ if(!x.consigna||!Array.isArray(x.letras)||!x.letras.length) throw new Error("picapica["+i+"] necesita consigna y letras"); x.sugeridas=x.sugeridas||{}; });
  c.descubrilo.forEach((x,i)=>{ if(!x.respuesta||!Array.isArray(x.pistas)||x.pistas.length!==3) throw new Error("descubrilo["+i+"] necesita respuesta y 3 pistas"); });
  c.queesesto.forEach((x,i)=>{ if(!x.respuesta) throw new Error("chongo["+i+"] necesita nombre"); x.image=x.image||""; });
  c.emojis.forEach((x,i)=>{ if(!x.respuesta||!x.emojis) throw new Error("emojis["+i+"] necesita emojis y respuesta"); x.acepta=x.acepta||[]; });
  c.final=c.final||[]; if(typeof c.desempate==='string') c.desempate=[{pregunta:c.desempate,respuesta:''}]; if(!Array.isArray(c.desempate)||!c.desempate.length) c.desempate=clone(DEFAULT_CONTENT.desempate);
}
function loadImage(i,file){
  if(!file) return; const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{ // reducir a 900px para no llenar el almacenamiento
      const side=Math.min(img.width,img.height), sx=(img.width-side)/2, sy=Math.max(0,(img.height-side)*0.35); // recorte cuadrado, un poco arriba del centro (caras)
      const cv=document.createElement("canvas"); cv.width=cv.height=Math.min(720,side); cv.getContext("2d").drawImage(img,sx,sy,side,side,0,0,cv.width,cv.height);
      const data=cv.toDataURL("image/jpeg",.8);
      commit("Foto cargada", s=>{ if(i<0){ s.content.queesesto.push({respuesta:"", image:data}); reshuffle(s,'queesesto'); } else { s.content.queesesto[i].image=data; delete s.content.queesesto[i].demo; } });
      modal={type:"contenido",tab:"queesesto"}; render(); toast(i<0?"Foto agregada: escribí el nombre.":"Foto cargada");
    }; img.src=fr.result; };
  fr.readAsDataURL(file);
}
function loadCover(file){
  if(!file) return; const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const cv=document.createElement("canvas"); const sc=Math.min(1,1000/Math.max(img.width,img.height)); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      const keepAlpha = /png|webp|gif/.test(file.type); let data = keepAlpha ? cv.toDataURL("image/webp",.9) : cv.toDataURL("image/jpeg",.86);
      if(data.length > 1.5e6){ data = keepAlpha ? cv.toDataURL("image/webp",.72) : cv.toDataURL("image/jpeg",.7); }
      commit("Foto nueva", s=>{ s.config.cover=data; }); toast("Foto guardada"); }; img.src=fr.result; };
  fr.readAsDataURL(file);
}
function copyText(t){ navigator.clipboard.writeText(t).then(()=>toast("Copiado al portapapeles")).catch(()=>{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); toast("Seleccioná y copiá el texto (Ctrl+C)"); }); }
function importFile(f){ if(!f) return; const fr=new FileReader(); fr.onload=()=>importText(fr.result); fr.readAsText(f); }
function importText(t){ try{ const s=JSON.parse(t); if(!s||s.v!==1||!s.config||!s.content) throw new Error("formato inválido"); undoStack.push({label:"importar",snap:clone(S)}); S=migrate(s); S.history.unshift(ts()+" · estado importado"); save(); broadcast(); modal=null; render(); toast("Estado cargado"); }catch(e){ toast("No se pudo cargar: "+e.message); } }
function resetAll(){ const content=S.content, config=S.config; S=initialState(); S.content=content; S.config=config; undoStack=[]; confirmKey=null; save(); broadcast(); modal=null; render(); toast("Listo: puntajes en cero y juegos sin empezar"); }
let toastT=null; function toast(m){ let el=$("#toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el);} el.textContent=m; el.style.display="block"; clearTimeout(toastT); toastT=setTimeout(()=>el.style.display="none",2200); }

/* ---------- teclado ---------- */
document.addEventListener("keydown", e=>{
  if(role!=="panel") return;
  const tag=(e.target.tagName||"").toLowerCase(); if(["input","textarea","select"].includes(tag) || e.target.isContentEditable) return;
  if(modal){ if(e.key==="Escape") closeModal(); return; }
  const key=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey) && key==="z"){ e.preventDefault(); undo(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k=curKey();
  if(key==="z"){ undo(); return; }
  if(key===" "){ e.preventDefault(); if(S.phase==="play" && !stageResolved(S)) timerToggle(); return; }
  if(key==="m" && S.phase!=="setup"){ gotoMenu(); return; }
  if(key==="n"){
    if(S.phase==="lobby") gotoMenu();
    else if(S.phase==="menu") gotoIntro(S.gi);
    else if(S.phase==="intro") startRound();
    else if(S.phase==="round"){ const nx=S.gi+1; nx<S.config.order.length? gotoIntro(nx) : nextGame(); }
    else if(S.phase==="play"){ k==="picapica"? (S.g.picapica.cardDone?pcNext():pcEndTurn()) : chNext(k); }
    return;
  }
  if(S.phase!=="play") return;
  if(k==="picapica"){ if(S.g.picapica.cardDone) return; const L=pcActiveLetter(); if(key==="1"||key==="c") pcMark(L,"ok"); else if(key==="2"||key==="x") pcMark(L,"bad"); else if(key==="3") pcMark(L,"pass"); return; }
  const c=S.g[k], resolved = c.solvedBy || c.locked.length>=teams().length;
  if(fixMode) return;
  if(key==="1"||key==="c"){ if(!resolved){ const a=chAnswering(k); if(a) chCorrect(k,a); } }
  else if(key==="2"||key==="x"){ if(!resolved) chWrong(k); }
  else if(key==="3"||key==="r"){ if(!c.showAnswer){ resolved? chShowAnswer(k) : chNobody(k); } }
  else if(key==="p"){ if(!resolved) chReveal(k); }
});

/* ---------- arranque y sincronización ---------- */
function boot(){
  role = location.hash.replace("#","")==="proyector" ? "proyector" : "panel";
  S = load() || initialState();
  try{ bc = bc || new BroadcastChannel("showagus"); bc.onmessage = ev=>{ const m=ev.data; if(!m) return;
      if(m.type==="state" && role==="proyector"){ S=m.state; peerHB=Date.now(); render(); }
      if(m.type==="hb"){ if(m.role!==role) peerHB=Date.now(); }
      if(m.type==="hello" && role==="panel") broadcast(); }; }catch(e){ bc=null; }
  if(!window._lsBound){ window._lsBound=true; window.addEventListener("storage", ev=>{ if(role==="proyector" && ev.key===SAVE_KEY && ev.newValue){ try{ S=JSON.parse(ev.newValue); peerHB=Date.now(); render(); }catch(e){} } if(ev.key===HB_KEY && ev.newValue){ try{ const h=JSON.parse(ev.newValue); if(h.role!==role) peerHB=Date.now(); }catch(e){} } }); }
  if(role==="proyector"){ try{ bc && bc.postMessage({type:"hello"}); }catch(e){} }
  render();
}
setInterval(tick, 250);
setInterval(()=>{ // latido para saber si la otra ventana está viva
  try{ bc && bc.postMessage({type:"hb",role}); localStorage.setItem(HB_KEY, JSON.stringify({role,t:Date.now()})); }catch(e){}
  const el=document.querySelector(".topbar .dot"); if(el){ const on=Date.now()-peerHB<6000; if(el.classList.contains("on")!==on) render(); }
  if(role==="proyector"){ const lost = peerHB && Date.now()-peerHB>15000; if(lost!==!!document.querySelector('.projWarn')) render(); }
  if(role==="proyector" && S && S.flash && Date.now()-S.flash.t<2000) render();
}, 2000);
window.addEventListener("hashchange", boot);
boot();
</script>
