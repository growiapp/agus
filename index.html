:root{
  --bg:#fff8f9; --panel:#ffffff; --line:#f3d3db; --line2:#f9e4e9;
  --fg:#1d0b12; --muted:#7d5461;
  --red:#e3173e; --red2:#ff6b8a; --pink:#ffd6df; --pink2:#fff0f3; --gold:#c9a24a;
  --ok:#17a36d; --bad:#1d0b12; --pass:#f59e0b;
  --display:'Unbounded','Arial Black','Segoe UI',system-ui,sans-serif; --body:'Manrope','Segoe UI',system-ui,sans-serif; --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;font-weight:600}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--pink2);color:var(--fg);transition:transform .08s,filter .15s,background .15s}
button:hover{filter:brightness(.97)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red2);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed;filter:none}
button.primary{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(227,23,62,.22)}
button.primary:hover{filter:brightness(1.08)}
button.ok{background:var(--ok);color:#fff}
button.bad{background:var(--bad);color:#fff}
button.pass{background:var(--pass);color:#fff}
button.ghost{background:transparent;border:1.5px solid var(--line)}
button.link{background:transparent;color:var(--red);padding:4px 6px}
button.danger{background:#fde0e4;color:#9b1030}
button.small{padding:6px 10px;font-size:13px;border-radius:9px}
button.xl{padding:18px 12px;font-size:17px;border-radius:14px}
button kbd{margin-left:6px}
input,select,textarea{font:inherit;background:#fff;color:var(--fg);border:1.5px solid var(--line);border-radius:9px;padding:8px 10px}
input[type=number]{width:72px}
textarea{width:100%;min-height:200px;font-family:ui-monospace,monospace;font-size:12px}
kbd{font-family:ui-monospace,monospace;font-size:11px;font-weight:600;background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--pink2);color:var(--red)}
.tag.ok{background:#e4f6ee;color:var(--ok)}
.tag.dark{background:var(--fg);color:#fff}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h3{font-size:15px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(29,11,18,.05),0 8px 24px rgba(227,23,62,.05)}
.hidden{display:none!important}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}

/* ===== PANEL ===== */
#app{height:100%;display:flex;flex-direction:column}
.panel{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:#fff;border-bottom:1px solid var(--line2)}
.topbar .title{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:8px}
.topbar .title img{height:30px;width:auto}
.topbar .spacer{flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-right:6px}
.dot.on{background:var(--ok)}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,1.05fr);gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));min-height:0;overflow:auto}
@media (max-width:980px){.main{grid-template-columns:1fr}}
.preview{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;max-width:min(100%,calc((100vh - 300px) * 16 / 9));background:#fff;box-shadow:0 2px 6px rgba(29,11,18,.08),0 14px 36px rgba(227,23,62,.10)}
.previewLabel{position:absolute;top:8px;left:10px;z-index:5;font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:rgba(29,11,18,.7);color:#fff;padding:3px 8px;border-radius:6px;font-weight:800}
.controls{display:flex;flex-direction:column;gap:12px;min-width:0}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status .game{font-family:var(--display);font-weight:700;font-size:14px;color:var(--red)}
.status .pos{color:var(--muted);font-size:13px}
.turnChip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--tc,#999);color:var(--tk,#fff);font-weight:800;font-size:13px}
.turnChip i{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.scoreRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.teamChip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#fff;border:2px solid transparent;box-shadow:inset 6px 0 0 var(--tc,#999)}
.teamChip.turn{border-color:var(--tc,#999)}
.teamChip .n{font-weight:800;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px}
.teamChip .s{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--tc,#333);cursor:pointer;padding:0 4px;border-radius:6px}
.teamChip .s:hover{background:var(--pink2)}
.teamChip .adj button{padding:3px 8px;font-size:12px;border-radius:6px}
.private{background:#fff;border:2px dashed var(--red);border-radius:14px;padding:10px 12px;position:relative}
.private .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:800;display:flex;justify-content:space-between;gap:8px}
.private .lbl span:last-child{font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.private .ans{font-size:20px;font-weight:800;margin-top:4px;line-height:1.2}
.private.peek .ans,.private.peek .list{filter:blur(7px)}
.private.peek:hover .ans,.private.peek:hover .list{filter:none}
.lettersCtl{display:flex;flex-wrap:wrap;gap:6px}
.lettersCtl button{width:44px;height:44px;font-family:var(--display);font-size:17px;padding:0;position:relative;border:2px solid transparent;background:var(--pink2)}
.lettersCtl button.active{border-color:var(--red);box-shadow:0 0 0 3px rgba(227,23,62,.18)}
.lettersCtl button.ok{background:var(--ok);color:#fff}
.lettersCtl button.bad{background:var(--bad);color:#fff}
.lettersCtl button.pass{background:var(--pass);color:#fff}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big2 button{padding:20px 8px;font-size:18px;border-radius:14px}
.big2 button small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:2px}
.progress{display:flex;gap:4px;flex-wrap:wrap}
.progress span{width:14px;height:14px;border-radius:4px;background:var(--pink);display:inline-block;position:relative}
.progress span.ok{background:var(--ok)}
.progress span.none{background:var(--fg)}
.progress span.skip{background:var(--pass)}
.progress span.cur{outline:2px solid var(--red);outline-offset:1px}
.next{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;color:var(--fg)}
.next .sec{color:var(--red)}
.hint{font-size:12px;color:var(--muted);background:var(--pink2);border-radius:8px;padding:6px 10px}
.hint.warn{background:#fde0e4;color:#9b1030;font-weight:700}
.big3 button{padding:18px 8px;font-size:16px;border-radius:14px}
.big3 button small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:2px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:8px;border-radius:999px;background:var(--pink)}
.steps span.on{background:var(--red)}
.timerBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timerBar .t{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;min-width:60px}
.timerBar .t.low{color:var(--red)}
.timerBar .st{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--pink2);color:var(--muted)}
.timerBar .st.run{background:#e4f6ee;color:var(--ok)}
.timerBar .st.done{background:#fde0e4;color:var(--red)}
.last{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.hist{font-size:12px;color:var(--muted);max-height:120px;overflow:auto;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(29,11,18,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--bg);border-radius:18px;padding:18px;max-width:900px;width:100%;max-height:90vh;overflow:auto}
.setupGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.teamEdit{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:12px;background:#fff;box-shadow:inset 6px 0 0 var(--tc,#999),0 1px 2px rgba(29,11,18,.05)}
.teamEdit .nm{display:flex;gap:6px;align-items:center;padding-left:6px}
.teamEdit input[type=text]{flex:1;min-width:0;font-weight:800}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-left:6px}
.swatches button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatches button.sel{box-shadow:0 0 0 2px var(--fg)}
.swatches label{width:26px;height:26px;border-radius:50%;overflow:hidden;position:relative;cursor:pointer;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);box-shadow:0 0 0 1px var(--line)}
.swatches label input{position:absolute;inset:-10px;opacity:0;width:60px;height:60px;cursor:pointer}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px}

    { respuesta: "Las Vegas", pistas: ["En mis casinos no hay relojes ni ventanas, a propósito.", "Tengo una Torre Eiffel, una pirámide y una Venecia, todas truchas.", "Lo que pasa acá, se queda acá."] },
    { respuesta: "Tini Stoessel", pistas: ["Mi papá produce televisión y mi primer papel fue chiquito, en Patito Feo.", "Salí con un futbolista campeón del mundo y la ruptura fue tema nacional.", "Antes de ser Tini, el mundo me conoció como Violetta."] },
    { respuesta: "Friends", pistas: ["Mi café favorito no existe: es un set de Burbank.", "Un mono, un pato y un pollo fueron personajes míos.", "Estábamos en un break."] },
    { respuesta: "Bridgerton", pistas: ["Mis bailes suenan a Ariana Grande y Billie Eilish, pero en versión cuarteto de cuerdas.", "Soy una serie de época producida por Shonda Rhimes.", "Lady Whistledown lo cuenta todo."] },
    { respuesta: "Dirty Dancing", pistas: ["Mis protagonistas se llevaban pésimo mientras me filmaban.", "La escena del lago se grabó en octubre, con el agua helada.", "Nadie pone a Baby en un rincón."] },
    { respuesta: "Pretty Woman", pistas: ["Mi guion original era un drama oscuro que se llamaba 3000.", "Un collar, un estuche que se cierra de golpe y una carcajada que no estaba en el guion.", "Richard Gere, Julia Roberts y una tarjeta de crédito en Rodeo Drive."] },
    { respuesta: "Beyoncé", pistas: ["Mi nombre es el apellido de soltera de mi mamá.", "Tengo más Grammys que cualquier otra persona en la historia.", "Si te gustaba, tenías que ponerle un anillo."] },
    { respuesta: "Taylor Swift", pistas: ["Empecé cantando country en Nashville y firmé mi primer contrato a los 14.", "Regrabé todos mis discos para ser dueña de mis propias canciones.", "Mi gira Eras rompió todos los récords y mi novio juega al fútbol americano."] }

function coverSrc(s){ return (s||S).config.cover || PHOTO_FULL; }
function faceSrc(s){ return (s||S).config.cover || PHOTO_FACE; }
/* color de texto legible sobre un color de equipo */
function ink(hex){ try{ const h=hex.replace('#',''); const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; const L=(0.2126*r+0.7152*g+0.0722*b)/255; return L>0.6?'#1d0b12':'#fff'; }catch(e){ return '#fff'; } }
function tstyle(t){ return `--tc:${t.color};--tk:${ink(t.color)}`; }
const SAVE_KEY = "showagus_v2";
const HB_KEY = "showagus_hb";

/* ======================================================================
   ESTADO
   ====================================================================== */
function freshGames(){ return { picapica:{card:0,letter:0,marks:{},cardDone:false}, descubrilo:ch(), queesesto:ch(), emojis:ch(), final:ch() }; }
function ch(){ return { i:0, rev:1, locked:[], solvedBy:null, pts:0, showAnswer:false, done:{} }; }
function chSnap(c){ return { rev:c.rev, locked:[...c.locked], solvedBy:c.solvedBy, pts:c.pts, showAnswer:c.showAnswer, visited:true }; }
function chGo(s,k,i){ const c=s.g[k]; const d=c.done||{}; d[c.i]=chSnap(c); s.flash=null; const saved=d[i]; s.g[k]= saved? {i, rev:saved.rev, locked:[...saved.locked], solvedBy:saved.solvedBy, pts:saved.pts, showAnswer:saved.showAnswer, done:d} : {...ch(), i, done:d}; }
function chResolved(c, n){ return !!c.solvedBy || c.locked.length>=n; }
function initialState(){
  return { v:1, phase:"setup", gi:0, config: clone(DEFAULT_CONFIG), content: clone(DEFAULT_CONTENT),
           scores:{t1:0,t2:0}, g: freshGames(), timer:{dur:30,endsAt:null,remain:30,running:false,expired:false},
           history:[], flash:null, winner:null, started:false };
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
let S = null, undoStack = [], bc = null, role = "panel", lastHB = 0, peerHB = 0, fixMode = false, adminOpen = false;

function migrate(s){
  const c=s.config; if(!c) return s;
  if(c.cover===undefined) c.cover=null;
  if(!c.migrated3){
    // v3: tiempos nuevos, cronómetro automático, colores de equipo distinguibles
    const old={picapica:30,descubrilo:20,queesesto:20,emojis:15}, nu={picapica:60,descubrilo:20,queesesto:20,emojis:20};
    Object.keys(nu).forEach(g=>{ if(c.games[g] && c.games[g].seconds===old[g]) c.games[g].seconds=nu[g]; });
    c.autoTimer=true; c.reboteReset=true;
    const oldCols=["#e3173e","#ff8fa8","#2a0a12","#f59e0b"];
    c.teams.forEach((t,i)=>{ if(oldCols.includes(t.color)) t.color=TEAM_COLORS[i%TEAM_COLORS.length]; });
    c.migrated3=true;
  }
  if(c.reboteReset===undefined) c.reboteReset=true;
  if(s.g) Object.keys(s.g).forEach(k=>{ if(k!=='picapica' && s.g[k] && !s.g[k].done) s.g[k].done={}; });
  return s;
}
function load(){ try{ const r = localStorage.getItem(SAVE_KEY); if(r){ const s = JSON.parse(r); if(s && s.v===1) return migrate(s); } }catch(e){} return null; }
let saveWarned=false;
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); saveWarned=false; }catch(e){ if(!saveWarned){ saveWarned=true; toast("No se pudo guardar en este navegador (sin espacio). La partida sigue, pero no sobrevive a una recarga: exportala desde Guardar / cargar."); } } }
function broadcast(){ try{ bc && bc.postMessage({type:"state", state:S}); }catch(e){} }

/* commit: toda modificación pasa por acá → snapshot para deshacer, guardar, sincronizar, renderizar */
function commit(label, fn, opts={}){
  if(!opts.noUndo){ undoStack.push({label, snap: clone(S)}); if(undoStack.length>40) undoStack.shift(); }
  fn(S);
  if(S.flash && !S.flash.key) S.flash.key = stageKey(S);
  if(label && !opts.silent){ S.history.unshift(ts()+" · "+label); S.history = S.history.slice(0,60); }
  save(); broadcast(); render();
}
function undo(){
  const u = undoStack.pop(); if(!u){ toast("Nada para deshacer"); return; }
  S = u.snap; S.history.unshift(ts()+" · ↶ deshacer: "+u.label); save(); broadcast(); render(); toast("Deshecho: "+u.label);
}
function ts(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function teams(){ return S.config.teams; }
function team(id){ return teams().find(t=>t.id===id); }
function curKey(){ return S.config.order[S.gi]; }
function cfg(k){ return S.config.games[k]; }
function items(k){ const all = S.content[k]||[]; const n = cfg(k).items ?? all.length; return all.slice(0, n); }
function pcCards(){ const per = cfg("picapica").cards; const total = Math.min(S.content.picapica.length, per*teams().length); return S.content.picapica.slice(0,total); }
function pcTeam(cardIdx){ return teams()[cardIdx % teams().length].id; }
function chStart(k,i){ return teams()[i % teams().length].id; }
function chAnswering(k){ // equipo que puede responder ahora (rotación desde el que arranca, salteando bloqueados)
  const c = S.g[k], n = teams().length, start = c.i % n;
  for(let j=0;j<n;j++){ const t = teams()[(start+j)%n]; if(!c.locked.includes(t.id)) return t.id; }
  return null;
}
function chPoints(k){
  const c = S.g[k], p = cfg(k).pts;
  if(Array.isArray(p)) return p[Math.min(c.rev,p.length)-1];
  return p;
}
function currentTurn(){
  const k = curKey(); if(S.phase!=="play" || !k) return null;
  if(k==="picapica") return pcTeam(S.g.picapica.card);
  if(S.g[k].solvedBy) return null;
  return chAnswering(k);
}

/* ======================================================================
   CRONÓMETRO (calcula por timestamp, sobrevive a cambios de pestaña)
   ====================================================================== */
function stopTimer(t){ const r=tRemain(t); t.remain=r; t.running=false; t.endsAt=null; return r; }
function tRemain(t){ if(!t) return 0; if(t.running && t.endsAt) return Math.max(0,(t.endsAt-Date.now())/1000); return t.remain; }
function timerStart(sec){ commit(null, s=>{ s.timer={dur:sec,endsAt:Date.now()+sec*1000,remain:sec,running:true,expired:false}; },{noUndo:true,silent:true}); }
function timerToggle(){
  const t=S.timer;
  if(t.running){ commit(null,s=>{ stopTimer(s.timer); },{noUndo:true}); }
  else if(t.remain>0 && !t.expired){ commit(null,s=>{ s.timer.endsAt=Date.now()+s.timer.remain*1000; s.timer.running=true; },{noUndo:true}); }
  else timerStart(curSeconds());
}
function timerReset(){ commit(null,s=>{ s.timer={dur:curSeconds(),endsAt:null,remain:curSeconds(),running:false,expired:false}; },{noUndo:true}); }
function curSeconds(){ const k=curKey(); return k? cfg(k).seconds : 30; }
let lastTickRender = 0;
function tick(){
  if(!S) return;
  const r = tRemain(S.timer);
  // actualizar sólo los nodos de tiempo (sin re-render completo)
  const low = S.timer.running && r<=5 && r>0, done = S.timer.expired || (S.timer.running && r<=0);
  document.querySelectorAll("[data-timer]").forEach(el=>{ el.textContent = fmt(r); el.classList.toggle("low", low); el.classList.toggle("done", done); });
  if(S.flash && Date.now()-S.flash.t>1700) document.querySelectorAll('.stToast').forEach(el=>el.remove());
  document.querySelectorAll("[data-tmr]").forEach(el=>{ el.classList.toggle("low", low); el.classList.toggle("done", done); el.classList.toggle("run", S.timer.running);
    const bar=el.querySelector(".bar"); if(bar){ const f = S.timer.dur? Math.max(0,Math.min(1,r/S.timer.dur)) : 0; bar.style.strokeDashoffset = (276.46*(1-f)).toFixed(1); }
    const ps=el.querySelector(".ps"); if(ps) ps.textContent = done? "tiempo" : S.timer.running? "" : (r<S.timer.dur? "pausa" : "listo"); });
  if(role==="panel" && S.timer.running && r<=0 && !S.timer.expired){
    commit(null, s=>{ s.timer.running=false; s.timer.expired=true; s.timer.remain=0; s.timer.endsAt=null; s.flash={k:'time',t:Date.now(),text:say('time',Date.now()/1000)}; },{noUndo:true});
    beep("time");
  }
}
function fmt(sec){ const s=Math.ceil(sec); return (s<10?"0":"")+s; }

/* ======================================================================
   SONIDO (sintetizado, sin archivos; sólo tras interacción)
   ====================================================================== */
let actx=null;
function beep(kind){
  if(!S.config.sound || role!=="panel") return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const seq = kind==="ok" ? [[660,.1],[990,.18]] : kind==="bad" ? [[220,.25]] : kind==="time" ? [[440,.12],[440,.12],[330,.4]] : [[523,.08],[659,.08],[784,.08],[1046,.3]];
    let t=actx.currentTime;
    seq.forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type= kind==="bad"?"sawtooth":"triangle"; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02); t+=d; });
  }catch(e){}
}

/* ======================================================================
   ACCIONES DE JUEGO
   ====================================================================== */
function startShow(){
  if(!S.config.order.length){ toast('Activá al menos una ronda'); return; }
  commit("Inicio del show", s=>{ s.phase="lobby"; s.started=true; s.gi=0; s.scores={}; teams().forEach(t=>s.scores[t.id]=0); s.g=freshGames(); s.winner=null; s.roundBase={}; });
}
function gotoIntro(gi){ commit("Instrucciones: "+GAMES[S.config.order[gi]].name, s=>{ s.gi=gi; s.phase="intro"; s.timer={dur:cfg(s.config.order[gi]).seconds,endsAt:null,remain:cfg(s.config.order[gi]).seconds,running:false,expired:false}; }); }
function startRound(){ const k=curKey(); if(!S.roundBase) S.roundBase={}; const needBase = S.roundBase[S.gi]===undefined; const base=clone(S.scores); const resolved = k==="picapica" ? !!S.g.picapica.cardDone : chResolved(S.g[k],teams().length); commit("Arranca "+GAMES[k].name, s=>{ if(needBase){ s.roundBase=s.roundBase||{}; s.roundBase[s.gi]=base; } s.phase="play"; s.timer={dur:curSeconds(),endsAt:null,remain:curSeconds(),running:false,expired:false}; }); if(S.config.autoTimer && !resolved) timerStart(curSeconds()); }
function endRound(){ commit("Fin de "+GAMES[curKey()].name, s=>{ s.phase="round"; stopTimer(s.timer); }); beep("win"); }
function nextGame(){
  const next = S.gi+1;
  if(next < S.config.order.length) { commit("Menú de juegos", s=>{ s.gi=next; s.phase="menu"; }); }
  else commit("Resultados finales", s=>{ s.phase="final"; s.winner=computeWinner(s); });
}
function computeWinner(s){
  const max = Math.max(...s.config.teams.map(t=>s.scores[t.id]||0));
  const tops = s.config.teams.filter(t=>(s.scores[t.id]||0)===max);
  return tops.length===1 ? tops[0].id : null;
}
function tiebreakWin(id){ commit('Gana el desempate: '+team(id).name, s=>{ s.scores[id]++; s.phase='final'; s.winner=computeWinner(s); }); beep('win'); }
function addScore(id, n, label){ commit(label||((n>0?"+":"")+n+" a "+team(id).name), s=>{ s.scores[id]=(s.scores[id]||0)+n; }); }
function setScore(id, n){ commit("Puntaje de "+team(id).name+" = "+n, s=>{ s.scores[id]=n; }); }

/* Pica Pica */
function pcMark(letter, mark){
  const c=S.g.picapica, card=pcCards()[c.card], tid=pcTeam(c.card), pts=cfg("picapica").pts;
  const prev = (c.marks[c.card]||{})[letter];
  if(prev===mark) return;
  const delta = (mark==="ok"?pts:0) - (prev==="ok"?pts:0);
  commit(`${letter}: ${mark==="ok"?"✓":mark==="bad"?"✗":"pasa"} (${team(tid).name})`, s=>{
    const m = s.g.picapica.marks[s.g.picapica.card] = s.g.picapica.marks[s.g.picapica.card]||{};
    m[letter]=mark; s.scores[tid]+=delta;
    // avanzar a la siguiente letra sin marcar
    const idx = card.letras.indexOf(letter);
    let nxt = card.letras.findIndex((L,i)=>i>idx && !m[L]);
    if(nxt<0) nxt = card.letras.findIndex(L=>!m[L]);
    s.g.picapica.letter = nxt<0 ? idx : nxt;
    s.flash = {k:mark, t:Date.now(), text: mark==='ok'? say('ok',Date.now()/1000) : mark==='bad'? say('bad',Date.now()/1000) : 'Paso', team: mark==='ok'? tid : null};
    if(nxt<0){ s.g.picapica.cardDone=true; (s.g.picapica.closed=s.g.picapica.closed||{})[s.g.picapica.card]=true; stopTimer(s.timer); }
  });
  beep(mark==="ok"?"ok":mark==="bad"?"bad":null);
}
function pcActiveLetter(){ const c=S.g.picapica; return pcCards()[c.card].letras[c.letter]; }
function pcEndTurn(){ commit("Cierra la tarjeta "+(S.g.picapica.card+1), s=>{ s.g.picapica.cardDone=true; (s.g.picapica.closed=s.g.picapica.closed||{})[s.g.picapica.card]=true; stopTimer(s.timer); }); }
function pcNext(){
  const total = pcCards().length;
  if(S.g.picapica.card+1 >= total){ endRound(); return; }
  commit("Siguiente tarjeta", s=>{ (s.g.picapica.closed=s.g.picapica.closed||{})[s.g.picapica.card]=true; s.g.picapica.card++; const m=s.g.picapica.marks[s.g.picapica.card]||{}; const card=withS(s,pcCards)[s.g.picapica.card]; const first=card.letras.findIndex(L=>!m[L]); s.g.picapica.letter=first<0?0:first; s.g.picapica.cardDone = first<0 || !!s.g.picapica.closed[s.g.picapica.card]; s.timer={dur:curSeconds(),endsAt:null,remain:curSeconds(),running:false,expired:false}; });
  if(S.config.autoTimer && !S.g.picapica.cardDone) timerStart(curSeconds());
}
function pcPrev(){ if(S.g.picapica.card===0) return; commit("Tarjeta anterior", s=>{ s.g.picapica.card--; const m=s.g.picapica.marks[s.g.picapica.card]||{}; const card=withS(s,pcCards)[s.g.picapica.card]; const first=card.letras.findIndex(L=>!m[L]); s.g.picapica.letter=first<0?0:first; s.g.picapica.cardDone = first<0 || !!s.g.picapica.closed?.[s.g.picapica.card]; stopTimer(s.timer); }); }

/* Descubrilo / Qué es esto / Emojis / Final (modelo común) */
function chReveal(k){ const max = k==="descubrilo"? 3 : k==="queesesto"? 4 : 1; if(S.g[k].rev>=max) return; commit(k==="queesesto"?"Revela etapa "+(S.g[k].rev+1):"Pista "+(S.g[k].rev+1), s=>{ s.g[k].rev++; }); }
function chCorrect(k, tid){
  const c=S.g[k]; if(c.solvedBy===tid) return;
  if(c.solvedBy && !fixMode) return;
  const pts = c.solvedBy ? c.pts : chPoints(k);
  commit(c.solvedBy? `Corrige: ✓ ${team(tid).name} +${pts} (antes ${team(c.solvedBy).name})` : `✓ ${team(tid).name} +${pts} (${GAMES[k].short})`, s=>{ if(s.g[k].solvedBy){ s.scores[s.g[k].solvedBy]-=s.g[k].pts; } s.g[k].locked=s.g[k].locked.filter(x=>x!==tid); s.g[k].solvedBy=tid; s.g[k].pts=pts; s.scores[tid]+=pts; s.g[k].showAnswer=true; stopTimer(s.timer); s.flash={k:"ok",t:Date.now(),text:say('ok',Date.now()/1000)+" +"+pts,team:tid}; if(k==="queesesto") s.g[k].rev=4; });
  fixMode=false; beep("ok");
}
function chWrong(k){
  const c=S.g[k], tid=chAnswering(k); if(!tid||c.solvedBy) return;
  commit(`✗ ${team(tid).name} (${GAMES[k].short})`, s=>{
    s.g[k].locked.push(tid);
    const nxt = cfg(k).rebote ? chAnswering(k) : null;
    s.flash={k:"bad",t:Date.now(),text: nxt? say('bad',Date.now()/1000)+" Rebota: "+team(nxt).name : say('bad',Date.now()/1000), team:null, pop:true};
    if(!nxt){ /* nadie más puede: se cierra */ s.g[k].locked = teams().map(t=>t.id); stopTimer(s.timer); }
    else if(s.config.autoTimer && s.config.reboteReset){ s.timer={dur:curSeconds(),endsAt:Date.now()+curSeconds()*1000,remain:curSeconds(),running:true,expired:false}; }
  });
  beep("bad");
}
function chNobody(k){ commit("Nadie la sacó ("+GAMES[k].short+")", s=>{ if(s.g[k].solvedBy){ s.scores[s.g[k].solvedBy]-=s.g[k].pts; s.g[k].solvedBy=null; s.g[k].pts=0; } s.g[k].locked=teams().map(t=>t.id); s.g[k].showAnswer=true; stopTimer(s.timer); if(k==="queesesto") s.g[k].rev=4; }); fixMode=false; }
function chShowAnswer(k){ commit("Revela respuesta", s=>{ s.g[k].showAnswer=true; if(k==="queesesto") s.g[k].rev=4; }); }
function chNext(k){
  const total = items(k).length;
  if(S.g[k].i+1 >= total){ endRound(); return; }
  commit("Siguiente ("+GAMES[k].short+")", s=>{ chGo(s,k,s.g[k].i+1); s.timer={dur:curSeconds(),endsAt:null,remain:curSeconds(),running:false,expired:false}; });
  fixMode=false;
  if(S.config.autoTimer && !chResolved(S.g[k],teams().length)) timerStart(curSeconds());
}
function chPrev(k){ if(S.g[k].i===0) return; commit("Anterior ("+GAMES[k].short+")", s=>{ chGo(s,k,s.g[k].i-1); stopTimer(s.timer); s.timer.expired=false; }); fixMode=false; }

function tileOrder(seed){ // estable por ítem: primero el borde (menos información), el centro al final
  const edge=[0,1,2,3,4,7,8,11,12,13,14,15], mid=[5,6,9,10]; let x=(seed+7)*2654435761>>>0;
  const sh=a=>{ for(let i=a.length-1;i>0;i--){ x=(x*1664525+1013904223)>>>0; const j=x%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  return [...sh(edge), ...sh(mid)];
}
function confetti(canvas){
  if(canvas._on) return; canvas._on=true;
  const ctx=canvas.getContext("2d"); const W=canvas.width=canvas.offsetWidth||800, H=canvas.height=canvas.offsetHeight||450;
  const P=Array.from({length:Math.round(W/7)},()=>({x:Math.random()*W,y:-Math.random()*H,r:W/160+Math.random()*(W/110),c:["#e3173e","#ff6b8a","#ffc9d6","#1d0b12","#f5b800"][Math.random()*5|0],v:1+Math.random()*3,a:Math.random()*6}));
  let frames=0; const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function f(){ if(!canvas.isConnected || frames++>900 || reduce) return; ctx.clearRect(0,0,W,H); P.forEach(p=>{ p.y+=p.v; p.a+=.1; if(p.y>H) p.y=-10; ctx.fillStyle=p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }); requestAnimationFrame(f); })();
}

function phaseLabel(){ return {setup:"Preparación",lobby:"Bienvenida",menu:"Menú de juegos",intro:"Instrucciones",play:"En juego",round:"Fin de ronda",final:"Final",tiebreak:"Desempate"}[S.phase]; }

function timerBarHTML(){

function statusHTML(k, pos, prog, next){

function chProgress(k){

function chControls(k){
  const c=S.g[k], list=items(k), it=list[c.i], ans=chAnswering(k), maxRev = k==="descubrilo"?3:k==="queesesto"?4:1, isLast=c.i+1>=list.length;
  const closed = c.locked.length>=teams().length && !c.solvedBy;
  const label = k==="descubrilo"?"pista":k==="queesesto"?"etapa":null;
  const pos = k==="emojis"?`Película ${c.i+1} de ${list.length}`:k==="final"?`Pregunta ${c.i+1} de ${list.length}`:`${c.i+1} de ${list.length}`;
  const resolved = (c.solvedBy || closed) && !fixMode;
  const revisit = (c.done||{})[c.i] && (c.done[c.i].visited);
  return `<div class="card stack">
    ${statusHTML(k,pos, chProgress(k), resolved ? (isLast?'Resuelta. Terminá la ronda con N.':'Resuelta. Siguiente con N.') : fixMode ? 'Elegí el resultado correcto.' : closed ? 'Nadie la sacó: mostrá la respuesta o seguí.' : `Responde ${esc(ans?team(ans).name:'')}: Bien (1) o Mal (2).${label&&c.rev<maxRev?' Si piden ayuda, mostrá la próxima '+label+' (P).':''}`)}
    ${S.timer.expired && !resolved && !c.solvedBy && !closed ? `<div class="hint warn">Se acabó el tiempo. Si no respondieron, marcá Mal (rebota) o Nadie.</div>`:''}
    ${fixMode?`<div class="hint warn">Corrigiendo el resultado: elegí el equipo correcto o «Nadie». Los puntos se reacomodan solos.</div>`:''}
    ${k==="emojis"?`<div style="font-size:34px;text-align:center;line-height:1.2">${esc(it.emojis)}</div>`:k==="final"?`<div style="font-weight:800;font-size:17px">${esc(it.pregunta)}</div>`:""}
    ${label?`<div class="row between"><div class="steps" style="flex:1">${Array.from({length:maxRev},(_,i)=>`<span class="${i<c.rev?'on':''}"></span>`).join("")}</div><span class="muted" style="font-size:13px">${label} ${c.rev} de ${maxRev} · vale <b>${chPoints(k)}</b></span></div>`:''}
    ${resolved
      ? `<div class="row between"><span>${c.solvedBy?`<span class="tag ok">✓ ${esc(team(c.solvedBy).name)} +${c.pts}</span>`:`<span class="tag dark">Nadie la sacó</span>`} ${revisit?`<span class="tag">ya jugada</span>`:''}</span><span class="row">${!c.showAnswer?`<button class="small" onclick="chShowAnswer('${k}')">Mostrar respuesta en pantalla <kbd>3</kbd></button>`:''}<button class="link small" onclick="fixMode=true;render()">Corregir</button></span></div>
         <button class="primary xl" onclick="chNext('${k}')">${isLast?'Terminar la ronda →':'Siguiente →'} <kbd>N</kbd></button>`
      : fixMode
      ? `<div class="row">${teams().map(t=>`<button class="ok" style="flex:1" onclick="chCorrect('${k}','${t.id}')" ${c.solvedBy===t.id?'disabled':''}>✓ ${esc(t.name)} ${c.solvedBy===t.id?'(actual)':''}</button>`).join("")}<button class="bad" onclick="chNobody('${k}')">Nadie</button><button class="ghost" onclick="fixMode=false;render()">Cancelar</button></div>`
      : `<div class="big2"><button class="ok" onclick="chCorrect('${k}','${ans}')">✓ Bien<small>+${chPoints(k)} para ${esc(ans?team(ans).name:'')} <kbd>1</kbd></small></button><button class="bad" onclick="chWrong('${k}')">✗ Mal<small>${cfg(k).rebote&&teams().length>1?'rebota al otro equipo':'se cierra la consigna'} <kbd>2</kbd></small></button></div>
         <div class="row">${label?`<button class="${c.rev<maxRev?'primary':''}" style="flex:1" onclick="chReveal('${k}')" ${c.rev>=maxRev?'disabled':''}>${c.rev<maxRev?`Mostrar ${label} ${c.rev+1} · pasa a valer ${chPointsAt(k,c.rev+1)}`:`No quedan ${label}s`} <kbd>P</kbd></button>`:''}<button class="ghost" onclick="chNobody('${k}')">Nadie la sacó <kbd>3</kbd></button></div>
         ${teams().length>2?`<div class="row" style="font-size:12px"><span class="muted">Acertó otro equipo:</span>${teams().filter(t=>t.id!==ans).map(t=>`<button class="small ghost" onclick="chCorrect('${k}','${t.id}')">✓ ${esc(t.name)}</button>`).join("")}</div>`:''}`}
    <div class="private ${S.config.singleScreen?'peek':''}"><div class="lbl"><span>Respuesta</span>${k==="emojis"&&it.acepta.length?`<span>también vale: ${esc(it.acepta.join(", "))}</span>`:it.demo?`<span>imagen generada por IA, pendiente de reemplazar</span>`:''}</div><div class="ans">${esc(k==="final"?(it.respuesta||"(sin cargar)"):it.respuesta)}</div>
      ${k==="descubrilo"?`<ol class="list" style="margin:6px 0 0;padding-left:18px;font-size:13px">${it.pistas.map((p,i)=>`<li style="${i<c.rev?'':'opacity:.5'}">${esc(p)}</li>`).join("")}</ol>`:''}</div>
  </div>
  <div class="card stack">${timerBarHTML()}${navRow(`chPrev('${k}')`, `chNext('${k}')`, c.i>0, isLast, resolved)}</div>
  <div class="hotkeys"><kbd>1</kbd> bien · <kbd>2</kbd> mal · <kbd>3</kbd> nadie / revelar${label?` · <kbd>P</kbd> ${label}`:''} · <kbd>N</kbd> siguiente · <kbd>espacio</kbd> pausa · <kbd>Z</kbd> deshacer · <kbd>M</kbd> menú</div>`;
}
function chPointsAt(k,rev){ const p=cfg(k).pts; return Array.isArray(p)? p[Math.min(rev,p.length)-1] : p; }

/* ---------- setup helpers ---------- */
function teamEditHTML(t,i,removable){
  return `<div class="teamEdit" style="${tstyle(t)}"><div class="nm"><input type="text" id="tn${i}" value="${esc(t.name)}" onchange="setTeam(${i},'name',this.value)" maxlength="24">${removable?`<button class="small danger" onclick="removeTeam(${i})">✕</button>`:''}</div>
    <div class="swatches">${TEAM_COLORS.map((col,j)=>`<button class="${t.color.toLowerCase()===col?'sel':''}" style="background:${col}" title="${TEAM_COLOR_NAMES[j]}" onclick="setTeam(${i},'color','${col}')"></button>`).join("")}<label title="Otro color"><input type="color" value="${t.color}" oninput="setTeam(${i},'color',this.value)"></label><span class="muted" style="font-size:12px">${TEAM_COLOR_NAMES[TEAM_COLORS.indexOf(t.color.toLowerCase())]||'Personalizado'}</span></div></div>`;
}
function setTeam(i,f,v){ commit(null,s=>{ s.config.teams[i][f]=v; },{noUndo:true}); }
function addTeam(){ commit("Nuevo equipo",s=>{ const n=s.config.teams.length; const id="t"+(Date.now()%100000); s.config.teams.push({id,name:"Equipo "+(n+1),color:TEAM_COLORS[n%4]}); s.scores[id]=0; }); }
function removeTeam(i){ commit("Quita equipo",s=>{ const [t]=s.config.teams.splice(i,1); delete s.scores[t.id]; }); }
function toggleGame(g,on){ commit(null,s=>{ const all=Object.keys(GAMES); s.config.order = all.filter(x=> x===g? on : s.config.order.includes(x)); },{noUndo:true}); }
function setCfg(g,f,v){ commit(null,s=>{ s.config.games[g][f]=v; },{noUndo:true}); }
function toggleSound(){ commit(null,s=>{ s.config.sound=!s.config.sound; },{noUndo:true}); if(S.config.sound) beep("ok"); }
function promptScore(id){ modal={type:"score",id}; render(); }

/* ---------- modales ---------- */
function openModal(type){ modal={type}; render(); }
function closeModal(){ modal=null; render(); }
function modalHTML(m){
  let inner="";
  if(m.type==="score"){ const t=team(m.id); inner=`<h3>Puntaje de ${esc(t.name)}</h3><div class="row" style="margin-top:10px"><input type="number" id="scoreIn" value="${S.scores[m.id]||0}" style="width:120px"><button class="primary" onclick="setScore('${m.id}',+document.getElementById('scoreIn').value);closeModal()">Fijar</button></div>`; }
  if(m.type==="proyector"){ inner=`<h3>Proyector en una segunda pantalla</h3>
    <ol style="line-height:1.7">
      <li>Poné la compu en <b>escritorio extendido</b> (no duplicado).</li>
      <li>Abrí esta misma página en <b>otra ventana del navegador</b> y agregale <code>#proyector</code> al final de la dirección. Llevá esa ventana al proyector y ponela en pantalla completa (F11).</li>
      <li>Esta ventana queda en la notebook como panel de control. El punto verde de arriba confirma que el proyector recibe el estado.</li>
    </ol>
    <p class="muted">La sincronización es local (BroadcastChannel + almacenamiento del navegador): ambas ventanas tienen que estar en el <b>mismo navegador y perfil</b>. No pasa por ningún servidor.</p>
    <div class="row"><button onclick="location.hash='proyector';boot()">Convertir esta ventana en proyector</button></div>
    <h3 style="margin-top:18px">Plan B: una sola pantalla</h3>
    <p class="muted">Si solo hay pantalla duplicada, el público ve el panel. En este modo las respuestas quedan <b>borrosas</b> y solo se ven mientras pasás el mouse por encima. Conviene además tener la hoja de respuestas impresa (botón "Contenido" → "Copiar hoja de respuestas").</p>
    <label class="chk"><input type="checkbox" ${S.config.singleScreen?'checked':''} onchange="commit(null,s=>{s.config.singleScreen=this.checked},{noUndo:true})"> Activar modo una pantalla (respuestas borrosas hasta pasar el mouse)</label>`; }
  if(m.type==="config"){ const c=S.config; inner=`<h3>Configuración</h3><p class="muted">Se puede cambiar en cualquier momento; el progreso no se pierde.</p>
    <div class="setupGrid">
      <div class="card stack"><b>Equipos</b>${c.teams.map((t,i)=>teamEditHTML(t,i,false)).join("")}</div>
      <div class="card stack"><b>Puntajes</b>
        <label class="f">Pica Pica: puntos por palabra<input type="number" value="${c.games.picapica.pts}" onchange="setCfg('picapica','pts',+this.value)"></label>
        <label class="f">Descubrilo: puntos por pista (1ª,2ª,3ª)<input type="text" value="${c.games.descubrilo.pts.join(',')}" onchange="setCfg('descubrilo','pts',this.value.split(',').map(Number))"></label>
        <label class="f">¿Qué es esto?: puntos por etapa (1ª…4ª)<input type="text" value="${c.games.queesesto.pts.join(',')}" onchange="setCfg('queesesto','pts',this.value.split(',').map(Number))"></label>
        <label class="f">Emojis: puntos por acierto<input type="number" value="${c.games.emojis.pts}" onchange="setCfg('emojis','pts',+this.value)"></label>
        <label class="f">Final: puntos por acierto<input type="number" value="${c.games.final.pts}" onchange="setCfg('final','pts',+this.value)"></label></div>
      <div class="card stack"><b>Tiempos y rebotes</b>
        ${Object.keys(GAMES).map(g=>`<div class="row"><span style="width:110px;font-size:13px">${esc(GAMES[g].short)}</span><input type="number" min="5" max="180" style="width:70px" value="${c.games[g].seconds}" onchange="setCfg('${g}','seconds',+this.value)"><span class="muted" style="font-size:12px">seg por consigna</span>${g!=='picapica'?`<label class="chk" style="font-size:12px"><input type="checkbox" ${c.games[g].rebote?'checked':''} onchange="setCfg('${g}','rebote',this.checked)">rebote</label>`:''}</div>`).join("")}
        <label class="chk"><input type="checkbox" ${c.autoTimer?'checked':''} onchange="commit(null,s=>{s.config.autoTimer=this.checked},{noUndo:true})">El cronómetro arranca solo con cada consigna</label>
        <label class="chk"><input type="checkbox" ${c.reboteReset?'checked':''} onchange="commit(null,s=>{s.config.reboteReset=this.checked},{noUndo:true})">Tiempo nuevo cuando rebota al otro equipo</label>
        <label class="chk"><input type="checkbox" ${c.sound?'checked':''} onchange="commit(null,s=>{s.config.sound=this.checked},{noUndo:true})">Sonidos de acierto, error y tiempo</label></div>
    </div>`; }
  if(m.type==="contenido"){ inner=`<h3>Contenido</h3><p class="muted">Consignas, letras, pistas, respuestas y emojis se editan acá como JSON. Las fotos de «¿Qué es esto?» se cargan más abajo y quedan guardadas con la partida.</p>
    <div class="row"><button onclick="copyText(answerSheet())">📋 Copiar hoja de respuestas</button><button class="ghost" onclick="document.getElementById('cjson').value=JSON.stringify(S.content,null,2)">Recargar desde el estado</button><button class="danger" onclick="document.getElementById('cjson').value=JSON.stringify(DEFAULT_CONTENT,null,2)">Contenido de ejemplo</button></div>
    <textarea id="cjson" style="margin-top:8px;min-height:260px">${esc(JSON.stringify(S.content,null,2))}</textarea>
    <div class="row" style="margin-top:8px"><button class="primary" onclick="applyContent()">Aplicar contenido</button><span id="cmsg" class="muted"></span></div>
    <h3 style="margin-top:18px;font-size:15px">Imágenes de ¿Qué es esto?</h3>
    <div class="imgList" style="margin-top:8px">${S.content.queesesto.map((it,i)=>`<div class="it"><img src="${it.image}" alt=""><div>${i+1}. ${esc(it.respuesta)}${it.demo?' <span class="tag">generada</span>':''}</div><label class="small ghost" style="display:block;margin-top:4px;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:3px">Cambiar foto<input type="file" accept="image/*" class="hidden" onchange="loadImage(${i},this.files[0])"></label></div>`).join("")}
      <div class="it" style="display:grid;place-items:center"><label class="small ghost" style="cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:8px">+ Nueva imagen<input type="file" accept="image/*" class="hidden" onchange="loadImage(-1,this.files[0])"></label></div></div>`; }
  if(m.type==="guardar"){ inner=`<h3>Guardar / cargar</h3><p class="muted">Todo se guarda solo en este navegador después de cada acción. Para pasar la partida a otra compu, copiá el estado y pegalo acá.</p>
    <div class="row"><button onclick="copyText(JSON.stringify(S))">📋 Copiar estado completo</button><label class="ghost" style="cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700">Cargar archivo .json<input type="file" accept="application/json,.json" class="hidden" onchange="importFile(this.files[0])"></label></div>
    <textarea id="sjson" placeholder="Pegá acá un estado exportado…" style="margin-top:8px;min-height:120px"></textarea>
    <div class="row" style="margin-top:8px"><button class="primary" onclick="importText(document.getElementById('sjson').value)">Cargar desde el texto</button></div>
    <h3 style="margin-top:18px;font-size:15px;color:var(--bad)">Reiniciar todo</h3><p class="muted">Borra puntajes, progreso y configuración. El contenido editado se conserva.</p>
    <div class="row"><button class="danger" onclick="this.nextElementSibling.classList.remove('hidden');this.classList.add('hidden')">Reiniciar…</button><span class="hidden row"><span>¿Seguro?</span><button class="danger" onclick="resetAll()">Sí, reiniciar</button><button class="ghost" onclick="closeModal()">No</button></span></div>`; }
  return `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><div class="row" style="justify-content:flex-end"><button class="small ghost" onclick="closeModal()">Cerrar ✕</button></div>${inner}</div></div>`;
}
function answerSheet(){
  const C=S.content; let out="HOJA DE RESPUESTAS — Show de Agustina\n\n== PICA PICA ==\n";
  C.picapica.forEach((c,i)=>{ out+=`${i+1}. ${c.consigna}\n   `+c.letras.map(L=>`${L}: ${c.sugeridas[L]||'—'}`).join(" · ")+"\n"; });
  out+="\n== DESCUBRILO ==\n"; C.descubrilo.forEach((d,i)=>{ out+=`${i+1}. ${d.respuesta}\n   1) ${d.pistas[0]}\n   2) ${d.pistas[1]}\n   3) ${d.pistas[2]}\n`; });
  out+="\n== ¿QUÉ ES ESTO? ==\n"; C.queesesto.forEach((q,i)=>{ out+=`${i+1}. ${q.respuesta}${q.demo?' (imagen generada)':''}\n`; });
  out+="\n== EMOJIS ==\n"; C.emojis.forEach((e,i)=>{ out+=`${i+1}. ${e.emojis} → ${e.respuesta}${e.acepta.length?' (también: '+e.acepta.join(', ')+')':''}\n`; });
  out+="\n== GRAN FINAL ==\n"; C.final.forEach((f,i)=>{ out+=`${i+1}. ${f.pregunta} → ${f.respuesta||'(sin cargar)'}\n`; });
  out+="\n== DESEMPATE ==\n"+C.desempate+"\n"; return out;
}
function applyContent(){
  const msg=document.getElementById("cmsg");
  try{ const c=JSON.parse(document.getElementById("cjson").value); validateContent(c);
    commit("Contenido actualizado", s=>{ s.content=c; Object.keys(GAMES).forEach(g=>{ if(g!=="picapica" && s.config.games[g].items> (c[g]||[]).length) s.config.games[g].items=(c[g]||[]).length; }); });
    msg.textContent="Aplicado ✓"; msg.style.color="var(--ok)";
  }catch(e){ msg.textContent="Error: "+e.message; msg.style.color="var(--bad)"; }
}
function validateContent(c){
  if(!Array.isArray(c.picapica)||!c.picapica.length) throw new Error("picapica debe ser una lista con al menos 1 tarjeta");
  c.picapica.forEach((x,i)=>{ if(!x.consigna||!Array.isArray(x.letras)||!x.letras.length) throw new Error("picapica["+i+"] necesita consigna y letras"); x.sugeridas=x.sugeridas||{}; });
  c.descubrilo.forEach((x,i)=>{ if(!x.respuesta||!Array.isArray(x.pistas)||x.pistas.length!==3) throw new Error("descubrilo["+i+"] necesita respuesta y 3 pistas"); });
  c.queesesto.forEach((x,i)=>{ if(!x.respuesta||!x.image) throw new Error("queesesto["+i+"] necesita respuesta e image"); });
  c.emojis.forEach((x,i)=>{ if(!x.respuesta||!x.emojis) throw new Error("emojis["+i+"] necesita emojis y respuesta"); x.acepta=x.acepta||[]; });
  c.final=c.final||[]; c.desempate=c.desempate||DEFAULT_CONTENT.desempate;
}
function loadImage(i,file){
  if(!file) return; const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{ // reducir a 900px para no llenar el almacenamiento
      const cv=document.createElement("canvas"); const sc=Math.min(1,900/Math.max(img.width,img.height)); cv.width=img.width*sc; cv.height=img.height*sc; cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      const data=cv.toDataURL("image/jpeg",.82);
      commit("Imagen cargada", s=>{ if(i<0) s.content.queesesto.push({respuesta:"(editar respuesta)", image:data}); else { s.content.queesesto[i].image=data; delete s.content.queesesto[i].demo; } });
      modal={type:"contenido"}; render(); toast("Imagen guardada. Editá la respuesta en el JSON si hace falta.");
    }; img.src=fr.result; };
  fr.readAsDataURL(file);
}
function loadCover(file){
  if(!file) return; const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const cv=document.createElement("canvas"); const sc=Math.min(1,1000/Math.max(img.width,img.height)); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      const keepAlpha = /png|webp|gif/.test(file.type); let data = keepAlpha ? cv.toDataURL("image/webp",.9) : cv.toDataURL("image/jpeg",.86);
      if(data.length > 1.5e6){ data = keepAlpha ? cv.toDataURL("image/webp",.72) : cv.toDataURL("image/jpeg",.7); }
      commit("Foto nueva", s=>{ s.config.cover=data; }); toast("Foto guardada"); }; img.src=fr.result; };
  fr.readAsDataURL(file);
}
function copyText(t){ navigator.clipboard.writeText(t).then(()=>toast("Copiado al portapapeles")).catch(()=>{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); toast("Seleccioná y copiá el texto (Ctrl+C)"); }); }
function importFile(f){ if(!f) return; const fr=new FileReader(); fr.onload=()=>importText(fr.result); fr.readAsText(f); }
function importText(t){ try{ const s=JSON.parse(t); if(!s||s.v!==1||!s.config||!s.content) throw new Error("formato inválido"); undoStack.push({label:"importar",snap:clone(S)}); S=migrate(s); S.history.unshift(ts()+" · estado importado"); save(); broadcast(); modal=null; render(); toast("Estado cargado"); }catch(e){ toast("No se pudo cargar: "+e.message); } }
function resetAll(){ const content=S.content; S=initialState(); S.content=content; undoStack=[]; save(); broadcast(); modal=null; render(); toast("Reiniciado"); }
let toastT=null; function toast(m){ let el=$("#toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el);} el.textContent=m; el.style.display="block"; clearTimeout(toastT); toastT=setTimeout(()=>el.style.display="none",2200); }

/* ---------- teclado ---------- */
document.addEventListener("keydown", e=>{
  if(role!=="panel") return;
  const tag=(e.target.tagName||"").toLowerCase(); if(["input","textarea","select"].includes(tag) || e.target.isContentEditable) return;
  if(modal){ if(e.key==="Escape") closeModal(); return; }
  const key=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey) && key==="z"){ e.preventDefault(); undo(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k=curKey();
  if(key==="z"){ undo(); return; }
  if(key===" "){ e.preventDefault(); if(S.phase==="play") timerToggle(); return; }
  if(key==="m" && S.phase!=="setup"){ gotoMenu(); return; }
  if(key==="n"){
    if(S.phase==="lobby") gotoMenu();
    else if(S.phase==="menu") gotoIntro(S.gi);
    else if(S.phase==="intro") startRound();
    else if(S.phase==="round"){ const nx=S.gi+1; nx<S.config.order.length? gotoIntro(nx) : nextGame(); }
    else if(S.phase==="play"){ k==="picapica"? (S.g.picapica.cardDone?pcNext():pcEndTurn()) : chNext(k); }
    return;
  }
  if(S.phase!=="play") return;
  if(k==="picapica"){ if(S.g.picapica.cardDone) return; const L=pcActiveLetter(); if(key==="1"||key==="c") pcMark(L,"ok"); else if(key==="2"||key==="x") pcMark(L,"bad"); else if(key==="3") pcMark(L,"pass"); return; }
  const c=S.g[k], resolved = c.solvedBy || c.locked.length>=teams().length;
  if(fixMode) return;
  if(key==="1"||key==="c"){ if(!resolved){ const a=chAnswering(k); if(a) chCorrect(k,a); } }
  else if(key==="2"||key==="x"){ if(!resolved) chWrong(k); }
  else if(key==="3"||key==="r"){ if(!c.showAnswer){ resolved? chShowAnswer(k) : chNobody(k); } }
  else if(key==="p"){ if(!resolved) chReveal(k); }
});

/* ---------- arranque y sincronización ---------- */
function boot(){
  role = location.hash.replace("#","")==="proyector" ? "proyector" : "panel";
  S = load() || initialState();
  try{ bc = bc || new BroadcastChannel("showagus"); bc.onmessage = ev=>{ const m=ev.data; if(!m) return;
      if(m.type==="state" && role==="proyector"){ S=m.state; peerHB=Date.now(); render(); }
      if(m.type==="hb"){ if(m.role!==role) peerHB=Date.now(); }
      if(m.type==="hello" && role==="panel") broadcast(); }; }catch(e){ bc=null; }
  if(!window._lsBound){ window._lsBound=true; window.addEventListener("storage", ev=>{ if(role==="proyector" && ev.key===SAVE_KEY && ev.newValue){ try{ S=JSON.parse(ev.newValue); peerHB=Date.now(); render(); }catch(e){} } if(ev.key===HB_KEY && ev.newValue){ try{ const h=JSON.parse(ev.newValue); if(h.role!==role) peerHB=Date.now(); }catch(e){} } }); }
  if(role==="proyector"){ try{ bc && bc.postMessage({type:"hello"}); }catch(e){} }
  render();
}
setInterval(tick, 250);
setInterval(()=>{ // latido para saber si la otra ventana está viva
  try{ bc && bc.postMessage({type:"hb",role}); localStorage.setItem(HB_KEY, JSON.stringify({role,t:Date.now()})); }catch(e){}
  const el=document.querySelector(".topbar .dot"); if(el){ const on=Date.now()-peerHB<6000; if(el.classList.contains("on")!==on) render(); }
  if(role==="proyector"){ const lost = peerHB && Date.now()-peerHB>15000; if(lost!==!!document.querySelector('.projWarn')) render(); }
  if(role==="proyector" && S && S.flash && Date.now()-S.flash.t<2000) render();
}, 2000);
window.addEventListener("hashchange", boot);
boot();
</script>
